<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>مجتمع اندیشه</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#101827;font-family:Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:#101827;color:#fff;display:grid;place-items:center;font-size:20px}.brand b{display:block;font-size:15px}.brand small{color:#788397;font-size:9px}.adminlink{font-size:8px;color:#aab2bf;text-decoration:none}
.hero{background:linear-gradient(135deg,#101827,#263b67);color:#fff;border-radius:24px;padding:23px}.hero small{color:#c9d3e5}.hero h1{margin:7px 0;font-size:24px}.hero p{margin:0;color:#d8e0ee;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card{background:#fff;border:1px solid #e4e8ef;border-radius:17px;padding:14px}.stat small{color:#7a8495;font-size:9px}.stat b{display:block;font-size:20px;margin-top:8px}.bad{color:#d54b60}.good{color:#15936c}
.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button{background:#fff;border:1px solid #e2e7ef;border-radius:10px;padding:8px 11px;font-size:10px;white-space:nowrap}.nav button.on{background:#eaf0ff;border-color:#cbd8ff;color:#284ba9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{font-size:9px;color:#657085;display:block;margin-bottom:4px}.input,.select,.area{width:100%;border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:9px;outline:none}.input:focus{border-color:#7188d8}.btn{border:0;border-radius:10px;background:#3157d5;color:#fff;padding:9px 13px;font-size:10px;font-weight:700}.btn.light{background:#eef2f7;color:#344054}.btn.red{background:#fff0f2;color:#bf3347}.tablebox{overflow:auto;border:1px solid #e3e7ee;border-radius:12px;margin-top:10px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{font-size:9px;padding:9px;border-bottom:1px solid #edf0f4;text-align:right}.table th{background:#fafbfc;color:#697386}.pill{font-size:8px;border-radius:99px;padding:4px 7px;background:#eef2f6}.pill.bad{background:#ffebef}.pill.good{background:#e6f7f0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(390px,100%);background:#fff;border:1px solid #e4e8ef;border-radius:25px;padding:25px;box-shadow:0 18px 60px #10182712}.loginbox h1{font-size:21px;margin:15px 0 4px}.loginbox p{font-size:10px;color:#778296;margin:0 0 18px}.row{margin:10px 0}.row label{font-size:9px;color:#697386;display:block;margin-bottom:4px}.tiny{border:0;background:transparent;color:#a5adba;font-size:8px}
.modal{position:fixed;inset:0;background:#10182777;display:none;place-items:center;padding:14px;z-index:20}.modal.show{display:grid}.modalbox{width:min(800px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:15px;margin:0}.drawer{position:fixed;inset:0;background:#10182766;display:none;z-index:15}.drawer.show{display:block}.drawerbox{position:absolute;right:0;top:0;bottom:0;width:min(520px,95%);background:#fff;padding:18px;overflow:auto}
@media(max-width:700px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards,.grid{grid-template-columns:1fr}.hero{border-radius:20px}}
@media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body><div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div id="drawerbox" class="drawerbox"></div></div>
<script src="data.js"></script><script src="supabase-config.js"></script>
<script>
const KEY='andisheh_v4';
let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('andisheh_v3')||'null')||structuredClone(APP_DATA);
if(!db.units) db=structuredClone(APP_DATA);
const months=db.months;
for(const u of db.units){if(u.unitNo==null)u.unitNo=u.id;if(!u.charges)u.charges={};if(!u.payments)u.payments=[];}
const money=n=>new Intl.NumberFormat('fa-IR').format(+n||0)+' تومان';
const unit=id=>db.units.find(u=>u.id==id);
const byUnitNo=no=>db.units.find(u=>String(u.unitNo)===String(no));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const charges=u=>months.reduce((s,m)=>s+(+u.charges[m]||0),0), paid=u=>u.payments.reduce((s,p)=>s+(+p.amount||0),0);
const bal=u=>(+u.opening||0)+charges(u)-paid(u), stat=u=>bal(u)>0?'بدهکار':bal(u)<0?'طلبکار':'تسویه';
function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;bottom:15px;right:15px;background:#101827;color:#fff;padding:10px 14px;border-radius:10px;font-size:10px;z-index:50';document.body.appendChild(x)}x.textContent=t;clearTimeout(window._tt);window._tt=setTimeout(()=>x.remove(),2600)}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function login(kind='resident'){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div style="text-align:center"><div class="logo" style="margin:auto">🏢</div><div style="font-size:10px;color:#758195;margin-top:7px">سامانه مجتمع اندیشه</div></div><h1>${kind==='admin'?'ورود مدیر':'ورود ساکن'}</h1><p>${kind==='admin'?'مدیریت کامل اطلاعات مجتمع':'ورود با شماره واحد و رمز شخصی'}</p><div class="row"><label>${kind==='admin'?'نام کاربری':'شماره واحد'}</label><input id="lid" class="input" inputmode="numeric" placeholder="${kind==='admin'?'admin':'مثلاً ۱۲۳'}"></div><div class="row"><label>رمز شخصی</label><input id="lp" class="input" type="password" inputmode="numeric" placeholder="رمز ۶ رقمی"></div><button class="btn" style="width:100%;margin-top:8px" onclick="doLogin('${kind}')">ورود</button><div style="text-align:center;margin-top:14px"><button class="tiny" onclick="login('${kind==='admin'?'resident':'admin'}')">${kind==='admin'?'ورود ساکن':'مدیریت'}</button></div></div></div>`}
function doLogin(kind){let id=document.getElementById('lid').value.trim(),pw=document.getElementById('lp').value;if(kind==='admin'){if(id==='admin'&&pw==='eskandari1234')admin();else toast('نام کاربری یا رمز مدیر نادرست است')}else{let u=byUnitNo(id);if(u&&u.password===pw)resident(u);else toast('شماره واحد یا رمز نادرست است')}}
function header(title,sub){return `<div class="top"><div class="brand"><div class="logo">🏢</div><div><b>${title}</b><small>${sub}</small></div></div><a class="adminlink" href="#" onclick="event.preventDefault();login('admin')">مدیر</a></div>`}
function resident(u){document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','حساب شخصی • واحد '+u.unitNo)}<section class="hero"><small>حساب شما</small><h1>${u.name||'ساکن گرامی'}</h1><p>اینجا می‌توانید وضعیت شارژ، پرداخت‌ها، بدهی و مشخصات واحد را ببینید.</p></section><div class="cards"><div class="card stat"><small>مانده حساب</small><b class="${bal(u)>0?'bad':'good'}">${money(Math.abs(bal(u)))}</b><small>${stat(u)}</small></div><div class="card stat"><small>پرداخت ثبت‌شده</small><b>${money(paid(u))}</b></div><div class="card stat"><small>واحد</small><b>${u.unitNo}</b></div></div><div class="card"><h3 style="font-size:13px">سوابق پرداخت</h3><div class="tablebox"><table class="table"><tr><th>ماه</th><th>تاریخ</th><th>مبلغ</th><th>روش</th><th>پیگیری</th></tr>${u.payments.map(p=>`<tr><td>${p.month||'—'}</td><td>${p.date||'—'}</td><td>${money(p.amount)}</td><td>${p.method||'—'}</td><td>${p.ref||'—'}</td></tr>`).join('')||'<tr><td colspan="5">هنوز پرداختی ثبت نشده</td></tr>'}</table></div></div><div class="card" style="margin-top:10px"><h3 style="font-size:13px">مشخصات واحد</h3><div class="grid"><div><small>نام مالک</small><br>${u.owner||'—'}</div><div><small>مستأجر</small><br>${u.tenant||'—'}</div><div><small>تلفن</small><br>${u.phone||'—'}</div><div><small>طبقه</small><br>${u.floor||'—'}</div><div><small>پارکینگ</small><br>${u.parking||'—'}</div><div><small>انباری</small><br>${u.storage||'—'}</div></div></div><div style="text-align:center;margin:18px"><button class="tiny" onclick="login('resident')">خروج</button></div></main>`}
function admin(){document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','پنل مدیریت • ۲۱۰ واحد')}<div class="nav" id="nav">${[['dash','داشبورد'],['units','واحدها'],['pay','پرداخت‌ها'],['charge','شارژ'],['reports','گزارش‌ها'],['passwords','رمزها']].map(x=>`<button onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="syncAll()">☁ همگام‌سازی</button></div><div id="content"></div></main>`;tab('dash')}
function tab(t){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',['dash','units','pay','charge','reports','passwords'][i]===t));let c=document.getElementById('content');c.innerHTML=t==='dash'?dashboard():t==='units'?unitsPage():t==='pay'?paymentsPage():t==='charge'?chargePage():t==='reports'?reportsPage():passwordPage()}
function dashboard(){let debt=db.units.filter(u=>bal(u)>0),sum=debt.reduce((s,u)=>s+bal(u),0);return `<section class="hero"><small>مدیریت مجتمع</small><h1>کنترل ساده‌ی ۲۱۰ واحد</h1><p>اطلاعات با Supabase همگام می‌شود و شماره واحد از شناسه داخلی دیتابیس جداست.</p></section><div class="cards"><div class="card stat"><small>واحدها</small><b>۲۱۰</b></div><div class="card stat"><small>بدهکاران</small><b class="bad">${debt.length}</b></div><div class="card stat"><small>جمع بدهی</small><b class="bad">${money(sum)}</b></div></div><div class="card"><h3 style="font-size:13px">عملیات سریع</h3><div class="grid"><button class="btn" onclick="tab('units')">ویرایش واحدها</button><button class="btn" onclick="openPayment()">ثبت پرداخت</button><button class="btn" onclick="tab('reports')">گزارش مالی</button><button class="btn" onclick="printPasswords()">PDF رمزها</button></div></div>`}
function unitsPage(){return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="font-size:13px">۲۱۰ واحد</h3><button class="btn" onclick="generateMissingPasswords()">تولید رمزهای خالی</button></div><input id="uq" class="input" style="margin-top:10px" oninput="filterUnits()" placeholder="جستجوی واحد، نام، تلفن"><div class="tablebox"><table class="table"><thead><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th><th>مانده</th><th></th></tr></thead><tbody id="ur">${unitRows(db.units)}</tbody></table></div></div>`}
function unitRows(a){return a.slice().sort((x,y)=>+x.unitNo-+y.unitNo).map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${u.phone||'—'}</td><td>${u.password}</td><td>${money(Math.abs(bal(u)))}</td><td><button class="btn light" onclick="editUnit(${u.id})">ویرایش</button></td></tr>`).join('')}
function filterUnits(){let q=document.getElementById('uq').value.toLowerCase();document.getElementById('ur').innerHTML=unitRows(db.units.filter(u=>String(u.unitNo).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q)).slice(0,120))}
function editUnit(id){let u=unit(id);showModal(`<div class="modalhead"><h2>ویرایش واحد ${''}${u.unitNo}</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="field" style="margin-top:13px"><label>شماره واحد</label><input id="e_unitNo" class="input" type="number" value="${u.unitNo}"><small style="display:block;color:#758195;font-size:8px;margin-top:4px">اگر شماره مقصد قبلاً وجود داشته باشد، شماره دو واحد با هم جابه‌جا می‌شود و اطلاعات، پرداخت‌ها و شارژ هر واحد حفظ می‌شود.</small></div><div class="grid" style="margin-top:13px">${[['name','نام'],['owner','مالک'],['tenant','مستأجر'],['phone','تلفن'],['area','متراژ'],['floor','طبقه'],['parking','پارکینگ'],['storage','انباری'],['opening','مانده اول دوره'],['carIran','ایران خودرو'],['carMid','سه رقم وسط پلاک'],['carLetter','حرف پلاک'],['carEnd','دو رقم پلاک'],['carName','نام خودرو'],['carColor','رنگ خودرو'],['notes','یادداشت']].map(([k,l])=>`<div class="field"><label>${l}</label><input id="e_${k}" class="input" value="${esc(u[k])}"></div>`).join('')}</div><div class="field" style="margin-top:10px"><label>رمز شخصی ساکن</label><input id="e_password" class="input" value="${esc(u.password)}" inputmode="numeric"></div><button class="btn" style="margin-top:13px" onclick="saveUnit(${id})">ذخیره</button>`)}
async function saveUnit(id){let u=unit(id);if(!u)return;let newNo=String(document.getElementById('e_unitNo').value||'').trim();if(!/^\d+$/.test(newNo)||+newNo<1) return toast('شماره واحد معتبر نیست');let target=byUnitNo(newNo);const fields=['name','owner','tenant','phone','area','floor','parking','storage','opening','carIran','carMid','carLetter','carEnd','carName','carColor','notes','password'];for(const k of fields)u[k]=document.getElementById('e_'+k).value;try{if(target&&target.id!==u.id){const oldNo=u.unitNo;target.unitNo=oldNo;u.unitNo=+newNo;await cloudUnit(target);await cloudUnit(u);}else{u.unitNo=+newNo;await cloudUnit(u);}save();closeModal();tab('units');toast('تغییرات با موفقیت در دیتابیس ذخیره شد')}catch(e){console.error(e);toast('ذخیره نشد؛ اطلاعات محلی تغییر نکرد')}}
async function generateMissingPasswords(){let used=new Set(db.units.map(u=>u.password));let changed=[];for(const u of db.units)if(!u.password){let p;do p=String(Math.floor(100000+Math.random()*900000));while(used.has(p));u.password=p;used.add(p);changed.push(u)}try{for(const u of changed)await cloudUnit(u);save();tab('units');toast('رمزهای خالی ساخته و ذخیره شد')}catch(e){console.error(e);toast('ذخیره رمزها ناموفق بود')}}
function paymentsPage(){let a=[];db.units.forEach(u=>u.payments.forEach((p,i)=>a.push({...p,unit:u.unitNo,name:u.name||'—',idx:i,id:u.id})));a.reverse();return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">پرداخت‌ها</h3><button class="btn" onclick="openPayment()">＋ ثبت</button></div><div class="tablebox"><table class="table"><tr><th>واحد</th><th>ماه</th><th>مبلغ</th><th>تاریخ</th><th>پیگیری</th><th></th></tr>${a.map(p=>`<tr><td>${p.unit}</td><td>${p.month||'—'}</td><td>${money(p.amount)}</td><td>${p.date||'—'}</td><td>${p.ref||'—'}</td><td><button class="btn red" onclick="delPay(${p.id},${p.idx})">حذف</button></td></tr>`).join('')||'<tr><td colspan="6">رکوردی نیست</td></tr>'}</table></div></div>`}
function openPayment(){showModal(`<div class="modalhead"><h2>ثبت پرداخت</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="grid" style="margin-top:13px"><div class="field"><label>واحد</label><input id="p_unit" class="input" type="number"></div><div class="field"><label>ماه</label><select id="p_month" class="select">${months.map(m=>`<option>${m}</option>`).join('')}</select></div><div class="field"><label>مبلغ</label><input id="p_amount" class="input" type="number"></div><div class="field"><label>تاریخ</label><input id="p_date" class="input"></div><div class="field"><label>روش</label><input id="p_method" class="input"></div><div class="field"><label>پیگیری</label><input id="p_ref" class="input"></div></div><button class="btn" style="margin-top:13px" onclick="savePay()">ثبت پرداخت</button>`)}
async function savePay(){let u=byUnitNo(document.getElementById('p_unit').value);if(!u)return toast('واحد پیدا نشد');let p={month:document.getElementById('p_month').value,amount:+document.getElementById('p_amount').value||0,date:document.getElementById('p_date').value,method:document.getElementById('p_method').value,ref:document.getElementById('p_ref').value};try{const rows=await SB('payments',{method:'POST',headers:{'Prefer':'return=representation'},body:JSON.stringify({unit_id:u.id,month:p.month,amount:p.amount,payment_date:p.date,method:p.method,reference:p.ref})});p.id=rows&&rows[0]?rows[0].id:null;u.payments.push(p);save();closeModal();tab('pay');toast('پرداخت در دیتابیس ثبت شد')}catch(e){console.error(e);toast('ثبت پرداخت ناموفق بود')}}
async function delPay(uid,i){if(!confirm('حذف شود؟'))return;let u=unit(uid);if(!u)return;let p=u.payments[i];try{if(p.id!=null)await SB('payments?id=eq.'+encodeURIComponent(p.id),{method:'DELETE'});else throw Error('شناسه پرداخت پیدا نشد');u.payments.splice(i,1);save();tab('pay');toast('پرداخت حذف شد')}catch(e){console.error(e);toast('حذف ناموفق بود')}}
function chargePage(){return `<div class="card"><h3 style="font-size:13px">شارژ ماهانه هر واحد</h3><p style="font-size:9px;color:#758195">مدیر می‌تواند مبلغ هر ماه را برای هر واحد جداگانه تعیین کند.</p><div class="grid">${months.map(m=>`<div class="field"><label>${m}</label><input id="cm_${m}" class="input" type="number"></div>`).join('')}</div><button class="btn" style="margin-top:13px" onclick="setAllCharges()">اعمال برای ۲۱۰ واحد</button></div>`}
async function setAllCharges(){const before=db.units.map(u=>({id:u.id,charges:{...u.charges}}));months.forEach(m=>{let v=+document.getElementById('cm_'+m).value||0;db.units.forEach(u=>u.charges[m]=v)});try{await cloudCharges();save();toast('شارژها در دیتابیس ذخیره شد')}catch(e){before.forEach(x=>{let u=unit(x.id);u.charges=x.charges});console.error(e);toast('ذخیره شارژ ناموفق بود')}}
function reportsPage(){let a=db.units.slice().sort((x,y)=>bal(y)-bal(x));return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">گزارش مالی ۲۱۰ واحد</h3><div><button class="btn light" onclick="exportCSV()">Excel</button> <button class="btn" onclick="printReport()">PDF</button></div></div><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${a.map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${u.phone||'—'}</td><td>${money(charges(u))}</td><td>${money(paid(u))}</td><td>${money(Math.abs(bal(u)))}</td><td><span class="pill ${bal(u)>0?'bad':'good'}">${stat(u)}</span></td></tr>`).join('')}</table></div></div>`}
function exportCSV(){let s='\ufeffواحد,نام,تلفن,شارژ,پرداخت,مانده,وضعیت\n'+db.units.slice().sort((a,b)=>+a.unitNo-+b.unitNo).map(u=>[u.unitNo,u.name,u.phone,charges(u),paid(u),bal(u),stat(u)].map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');download(s,'andisheh-report.csv','text/csv;charset=utf-8')}
function passwordPage(){return `<div class="card"><h3 style="font-size:13px">رمزهای ورود ساکنین</h3><p style="font-size:9px;color:#758195">رمزهای ۶ رقمی هر واحد. شماره واحد از شناسه داخلی جداست.</p><button class="btn" onclick="printPasswords()">نمایش و چاپ PDF رمزها</button><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>رمز شخصی</th></tr>${db.units.slice().sort((a,b)=>+a.unitNo-+b.unitNo).map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td><b>${u.password}</b></td></tr>`).join('')}</table></div></div>`}
function printPasswords(){let rows=db.units.slice().sort((a,b)=>+a.unitNo-+b.unitNo).map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td><b>${u.password}</b></td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>رمزهای مجتمع اندیشه</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:right;font-size:12px}</style></head><body><h1>مجتمع اندیشه — فهرست رمز ورود ساکنین</h1><table><tr><th>واحد</th><th>نام</th><th>رمز شخصی</th></tr>${rows}</table><script>window.print()<\/script></body></html>`);w.document.close()}
function printReport(){let rows=db.units.slice().sort((a,b)=>+a.unitNo-+b.unitNo).map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${money(charges(u))}</td><td>${money(paid(u))}</td><td>${money(Math.abs(bal(u)))}</td><td>${stat(u)}</td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش مجتمع اندیشه</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:7px;text-align:right;font-size:11px}</style></head><body><h1>مجتمع اندیشه</h1><table><tr><th>واحد</th><th>نام</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${rows}</table><script>window.print()<\/script></body></html>`);w.document.close()}
function showModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
function download(c,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function SB(path,opt={}){const h=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(!r.ok)throw Error(await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}
async function cloudLoad(){const us=await SB('units?select=*&order=id.asc');for(const r of us||[]){const u=unit(r.id);if(!u)continue;Object.assign(u,{unitNo:r.unit_no==null?r.id:+r.unit_no,name:r.name||'',phone:r.phone||'',password:r.password||u.password,owner:r.owner||'',tenant:r.tenant||'',area:r.area||'',floor:r.floor||'',parking:r.parking||'',storage:r.storage||'',opening:+(r.opening||0),notes:r.notes||'',carIran:r.car_iran||'',carMid:r.car_mid||'',carLetter:r.car_letter||'',carEnd:r.car_end||'',carName:r.car_name||'',carColor:r.car_color||''})}for(const u of db.units){u.charges={};u.payments=[]}const cs=await SB('charges?select=unit_id,month,amount');for(const r of cs||[]){const u=unit(r.unit_id);if(u&&r.month)u.charges[r.month]=+(r.amount||0)}const ps=await SB('payments?select=id,unit_id,month,amount,payment_date,method,reference&order=id.asc');for(const r of ps||[]){const u=unit(r.unit_id);if(u)u.payments.push({id:r.id,month:r.month||'',amount:+(r.amount||0),date:r.payment_date||'',method:r.method||'',ref:r.reference||''})}save();return true}
async function cloudUnit(u){return SB('units?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({unit_no:+u.unitNo,name:u.name||'',phone:u.phone||'',password:u.password||'',owner:u.owner||'',tenant:u.tenant||'',area:u.area||'',floor:u.floor||'',parking:u.parking||'',storage:u.storage||'',opening:+(u.opening||0),notes:u.notes||'',car_iran:u.carIran||'',car_mid:u.carMid||'',car_letter:u.carLetter||'',car_end:u.carEnd||'',car_name:u.carName||'',car_color:u.carColor||''})})}
async function cloudCharges(){const old=await SB('charges?select=id,unit_id,month,amount');const wanted=new Map();for(const u of db.units)for(const m of months){const a=+(u.charges[m]||0);if(a)wanted.set(u.id+'|'+m,{unit_id:u.id,month:m,amount:a})}for(const r of old||[]){if(!wanted.has(r.unit_id+'|'+r.month))await SB('charges?id=eq.'+encodeURIComponent(r.id),{method:'DELETE'})}const rows=[...wanted.values()];if(rows.length)await SB('charges?on_conflict=unit_id,month',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function cloudPayments(){const old=await SB('payments?select=id');for(const r of old||[])await SB('payments?id=eq.'+r.id,{method:'DELETE'});const rows=[];for(const u of db.units)for(const p of u.payments)rows.push({unit_id:u.id,month:p.month||'',amount:+p.amount||0,payment_date:p.date||'',method:p.method||'',reference:p.ref||''});if(rows.length)await SB('payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)})}
async function syncAll(){try{for(const u of db.units)await cloudUnit(u);await cloudCharges();await cloudPayments();save();toast('همه اطلاعات با موفقیت در Supabase ذخیره شد')}catch(e){console.error(e);toast('همگام‌سازی ناموفق بود')}}
(async()=>{try{await cloudLoad();toast('اطلاعات از Supabase بارگذاری شد')}catch(e){console.error(e);toast('Supabase در دسترس نیست؛ اطلاعات محلی استفاده شد')}login('resident')})();
</script></body></html>
