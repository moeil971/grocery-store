<head>

<title>سامانه مدیریت مجتمع اندیشه</title>
<style>
:root{--bg:#f5f7fb;--surface:#fff;--ink:#172033;--muted:#7b8495;--line:#e6eaf1;--primary:#3156d8;--primary2:#6c5ce7;--success:#118267;--danger:#d0445a;--shadow:0 18px 55px rgba(22,34,63,.08);--r:20px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Vazirmatn",sans-serif;background:var(--bg);color:var(--ink)}button,input{font-family:inherit}button{cursor:pointer}.hidden{display:none!important}
/* ورود */
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 15% 10%,#dce6ff 0,#f7f9fc 40%,#edf0f7 100%)}
.login-card{width:min(430px,100%);background:rgba(255,255,255,.96);border:1px solid rgba(255,255,255,.8);border-radius:32px;padding:32px;box-shadow:0 30px 100px rgba(28,41,75,.16)}
.mark{width:72px;height:72px;margin:0 auto 18px;border-radius:24px;display:grid;place-items:center;color:#fff;font-size:30px;background:linear-gradient(145deg,#111827,#405fd1);box-shadow:0 16px 34px rgba(49,86,216,.24)}
.login-card h1{text-align:center;margin:0;font-size:26px;font-weight:800}.login-sub{text-align:center;color:var(--muted);font-size:11px;margin:7px 0 25px}.field{margin:13px 0}.field label{display:block;font-size:11px;font-weight:600;color:#657084;margin:0 0 7px}.input{width:100%;height:46px;border:1px solid #dfe4ed;border-radius:14px;background:#fff;color:var(--ink);padding:0 13px;outline:none;font-size:12px}.input:focus{border-color:#6a7de0;box-shadow:0 0 0 4px rgba(49,86,216,.09)}.primary{width:100%;height:47px;border:0;border-radius:14px;color:#fff;font-size:12px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 12px 28px rgba(49,86,216,.22)}.admin-link{display:block;text-align:center;margin-top:16px;color:#8b94a5;text-decoration:none;font-size:10px}.admin-link:hover{color:var(--primary)}.login-note{text-align:center;color:#a0a8b6;font-size:9px;margin-top:12px}
/* عمومی */
.wrap{max-width:1440px;margin:auto;padding:15px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#111827,#405fd1);font-size:20px}.brand b{display:block;font-size:15px;font-weight:800}.brand small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.ghost{border:0;background:transparent;color:#7f899a;font-size:10px}.hero{background:radial-gradient(circle at 10% 10%,#536fe1 0,#2d4277 38%,#101827 100%);color:#fff;border-radius:25px;padding:23px;box-shadow:0 20px 55px rgba(25,43,79,.15);margin-bottom:12px}.hero small{color:#d6dff4;font-size:9px}.hero h1{margin:5px 0;font-size:23px;font-weight:800}.hero p{margin:0;color:#dbe3f1;font-size:10px;line-height:2}.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button{border:1px solid var(--line);background:#fff;color:#606b7e;border-radius:12px;padding:9px 12px;font-size:10px;white-space:nowrap}.nav button.on{background:#eaf0ff;border-color:#cad7ff;color:#2b50b6;font-weight:800}.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.toolbar h2,.toolbar h3{margin:0;font-size:14px}.hint{color:var(--muted);font-size:9px;line-height:1.9}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:9px 12px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));font-size:10px;font-weight:700}.btn.light{background:#eef1f6;color:#465165}.btn.green{background:#e7f7f1;color:#10745c}.btn.red{background:#fff0f3;color:#b82f46}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0}.stat{padding:13px}.stat small{font-size:9px;color:var(--muted)}.stat b{display:block;font-size:18px;margin-top:5px;direction:ltr;text-align:right;letter-spacing:.2px}.resident-stats .stat{background:linear-gradient(180deg,#ffffff,#f8faff);border-color:#dfe6f5}.resident-stats .stat small{font-size:10px;color:#5f6b80}.resident-stats .stat b{font-size:17px;color:#182238}.good{color:var(--success)!important}.bad{color:var(--danger)!important}.search{margin:10px 0}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{border-bottom:1px solid #edf0f4;padding:7px 5px;text-align:right;vertical-align:middle;font-size:8.5px}.table th{background:#fafbfd;color:#667186;font-weight:800}.table tr:last-child td{border-bottom:0}.compact th,.compact td{padding:5px 3px;font-size:7.5px}.inline{width:100%;height:32px;border:1px solid #dfe4ec;border-radius:8px;padding:0 5px;outline:none;background:#fff;font-size:9px;min-width:0}.inline:focus{border-color:#7183df;box-shadow:0 0 0 3px rgba(49,86,216,.08)}.money{direction:ltr;text-align:right}.resident-table th,.resident-table td{font-size:10px!important;padding:9px 5px}.resident-table .status{font-size:9px;padding:5px 7px}.resident-table{table-layout:fixed}.resident-table th:first-child,.resident-table td:first-child{width:55px}.status{display:inline-flex;align-items:center;justify-content:center;border-radius:99px;padding:4px 6px;font-size:7px;background:#eef1f5;color:#657084;white-space:nowrap}.status.ok{background:#e7f7f1;color:#11785f}.status.bad{background:#ffedf0;color:#b63249}.status.partial{background:#fff4df;color:#9a6500}.center{text-align:center!important}.muted{color:var(--muted)}.month-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px}.month-box{border:1px solid var(--line);border-radius:13px;padding:9px;background:#fbfcfe}.month-box b{display:block;font-size:10px;margin-bottom:5px}.month-box label{font-size:8px;color:var(--muted)}.month-box .input{height:38px;margin-top:4px;font-size:10px}.result{margin-top:10px}.empty{text-align:center;padding:30px;color:#8b94a3;font-size:10px}.modal{position:fixed;inset:0;background:rgba(7,13,27,.6);display:none;place-items:center;padding:12px;z-index:100}.modal.show{display:grid}.modalbox{width:min(1000px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:23px;padding:16px}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.print-title{display:none}
/* جدول اصلی: همه ماه‌ها در یک صفحه */
.overview-table{font-variant-numeric:tabular-nums}.overview-table th:nth-child(1),.overview-table td:nth-child(1){width:38px}.overview-table th:nth-child(2),.overview-table td:nth-child(2){width:70px}.overview-table th:nth-child(3),.overview-table td:nth-child(3){width:48px}.overview-table th:nth-child(n+4),.overview-table td:nth-child(n+4){width:auto}.overview-table td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pay-cell{font-weight:700;text-align:center!important}.pay-cell input{width:100%;height:27px;border:1px solid #e0e5ed;border-radius:7px;text-align:center;font-family:inherit;font-size:7px;padding:0 2px;outline:none}.pay-cell input:focus{border-color:#7183df}.month-head{display:block;font-size:8px}.month-head small{display:block;font-size:6px;color:#9aa3b1;font-weight:500;margin-top:1px}
/* چاپ */
@media print{body{background:#fff}.noprint,.nav,.top .ghost,.actions,.search,.no-print{display:none!important}.wrap{max-width:none;padding:0}.card,.hero{box-shadow:none;border:1px solid #ddd}.hero{background:#fff;color:#111}.hero small,.hero p{color:#555}.print-title{display:block}.print-title h2{font-size:16px;margin:0 0 8px}.table-wrap{overflow:visible}.overview-table th,.overview-table td{font-size:6.5px;padding:3px}.pay-cell input{border:0;height:18px}.password-print{page-break-inside:avoid}}
@media(max-width:700px){.wrap{padding:9px}.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr 1fr}.month-grid{grid-template-columns:repeat(3,1fr)}.hero{padding:19px}.hero h1{font-size:20px}.card{padding:10px}.overview-table th,.overview-table td{padding:4px 2px;font-size:6.5px}.overview-table th:nth-child(1),.overview-table td:nth-child(1){width:31px}.overview-table th:nth-child(2),.overview-table td:nth-child(2){width:58px}.overview-table th:nth-child(3),.overview-table td:nth-child(3){width:42px}.month-head{font-size:6.5px}.month-head small{font-size:5px}.pay-cell input{height:24px;font-size:6.5px}.status{font-size:6px;padding:3px 4px}}
@media(max-width:420px){.overview-table th:nth-child(1),.overview-table td:nth-child(1){width:28px}.overview-table th:nth-child(2),.overview-table td:nth-child(2){width:53px}.overview-table th:nth-child(3),.overview-table td:nth-child(3){width:38px}.overview-table th,.overview-table td{font-size:6px}.pay-cell input{height:22px;font-size:6px}.month-head{font-size:6px}}
</style>
</head>
<body>
<div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script src="data.js"></script>
<script>
const months=['تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const KEY='andisheh_v6';
let saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
let db=saved||structuredClone(APP_DATA);db.units=db.units||[];db.units.forEach(u=>{u.charges=u.charges||{};u.payments=Array.isArray(u.payments)?u.payments:[];u.opening=+u.opening||0});
let monthlyCharges={};try{monthlyCharges=JSON.parse(localStorage.getItem(KEY+'_monthly')||'{}')}catch(e){}
months.forEach(m=>{if(monthlyCharges[m]===undefined)monthlyCharges[m]=0});
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const saveMonthly=()=>localStorage.setItem(KEY+'_monthly',JSON.stringify(monthlyCharges));
const money=n=>new Intl.NumberFormat('fa-IR').format(+n||0);
const unit=id=>db.units.find(u=>String(u.id)===String(id));
const paid=u=>u.payments.reduce((s,p)=>s+(+p.amount||0),0);
const monthPaid=(u,m)=>u.payments.filter(p=>p.month===m).reduce((s,p)=>s+(+p.amount||0),0);
const chargeFor=m=>+monthlyCharges[m]||0;
const totalCharge=()=>months.reduce((s,m)=>s+chargeFor(m),0);
const balance=u=>(+u.opening||0)+totalCharge()-paid(u);
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;bottom:15px;right:15px;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:10px;z-index:200;box-shadow:0 12px 35px #0003';document.body.appendChild(x)}x.textContent=t;clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.remove(),2200)}
function login(kind='resident'){document.getElementById('app').innerHTML=`<div class="login"><div class="login-card"><div class="mark">⌂</div><h1>مجتمع اندیشه</h1><div class="login-sub">${kind==='admin'?'ورود مدیریت مجتمع':'ورود ساکن'}</div><div class="field"><label>${kind==='admin'?'نام کاربری مدیر':'شماره واحد'}</label><input id="lid" class="input" type="text" inputmode="${kind==='admin'?'text':'numeric'}" autocomplete="off" placeholder="${kind==='admin'?'نام کاربری':'شماره واحد'}"></div><div class="field"><label>رمز عبور</label><input id="lp" class="input" type="text" autocomplete="off" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')doLogin('${kind}')"></div><button class="primary" onclick="doLogin('${kind}')">ورود</button>${kind==='resident'?'<a class="admin-link" href="#" onclick="event.preventDefault();login(\'admin\')">ورود مدیر</a>':'<a class="admin-link" href="#" onclick="event.preventDefault();login(\'resident\')">بازگشت به ورود ساکن</a>'}<div class="login-note">سامانه مدیریت و شارژ مجتمع اندیشه</div></div></div>`;setTimeout(()=>document.getElementById('lid')?.focus(),50)}
function doLogin(kind){const id=document.getElementById('lid').value.trim(),pw=document.getElementById('lp').value;if(kind==='admin'){if(id==='admin'&&pw==='eskandari1234')admin();else toast('نام کاربری یا رمز مدیر نادرست است')}else{const u=unit(id);if(u&&String(u.password)===pw)resident(u);else toast('شماره واحد یا رمز نادرست است')}}
function header(title,sub){return `<div class="top"><div class="brand"><div class="logo">⌂</div><div><b>${title}</b><small>${sub}</small></div></div><button class="ghost noprint" onclick="login('resident')">خروج</button></div>`}
function printCurrent(){window.print()}
function resident(u){document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','پنل ساکن • واحد '+esc(u.id))}<section class="hero"><small>حساب شخصی</small><h1>${esc(u.name||'ساکن واحد '+u.id)}</h1><p>${esc(u.phone||'شماره تلفن ثبت نشده')}</p></section><div class="stats resident-stats"><div class="card stat"><small>بدهی پیشین</small><b class="${u.opening>0?'bad':''}">${money(u.opening)} تومان</b></div><div class="card stat"><small>کل شارژ</small><b>${money(totalCharge())} تومان</b></div><div class="card stat"><small>کل پرداخت</small><b class="good">${money(paid(u))} تومان</b></div><div class="card stat"><small>مانده</small><b class="${balance(u)>0?'bad':'good'}">${money(Math.max(balance(u),0))} تومان</b></div></div><div class="card"><div class="toolbar"><div><h2>وضعیت شارژ ماه‌به‌ماه</h2><div class="hint">از تیر تا اسفند</div></div><button class="btn light noprint" onclick="printCurrent()">چاپ</button></div><div class="table-wrap" style="margin-top:10px"><table class="table resident-table"><tr><th>ماه</th>${months.map(m=>`<th class="center">${m}</th>`).join('')}</tr><tr><td>پرداخت</td>${months.map(m=>`<td class="center">${money(monthPaid(u,m))}</td>`).join('')}</tr><tr><td>وضعیت</td>${months.map(m=>{const c=chargeFor(m),p=monthPaid(u,m);let cls=c&&p>=c?'ok':p?'partial':c?'bad':'';let tx=c&&p>=c?'تسویه':p?'جزئی':c?'بدهکار':'—';return `<td class="center"><span class="status ${cls}">${tx}</span></td>`}).join('')}</tr></table></div></div><div class="card" style="margin-top:10px"><h2 style="font-size:13px;margin:0 0 9px">مشخصات شما</h2><div class="detail-grid"><div><span class="hint">شماره واحد</span><br><b>${esc(u.id)}</b></div><div><span class="hint">نام</span><br><b>${esc(u.name||'—')}</b></div><div><span class="hint">تلفن</span><br><b>${esc(u.phone||'—')}</b></div><div><span class="hint">بدهی پیشین</span><br><b>${money(u.opening)} تومان</b></div></div></div></main>`}
function admin(){document.getElementById('app').innerHTML=`<main class="wrap">${header('مدیریت مجتمع اندیشه','پنل مدیر • ${db.units.length} واحد')}<div class="nav noprint" id="nav"><button onclick="tab('overview')">نمای کلی</button><button onclick="tab('charges')">شارژ هر ماه</button><button onclick="tab('units')">واحدها</button><button onclick="tab('search')">جستجو</button><button onclick="tab('passwords')">رمزها</button></div><div id="content"></div></main>`;tab('overview')}
function tab(t){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',['overview','charges','units','search','passwords'][i]===t));document.getElementById('content').innerHTML={overview:overviewPage,charges:chargesPage,units:unitsPage,search:searchPage,passwords:passwordPage}[t]();if(t==='search')setTimeout(()=>document.getElementById('globalSearch')?.focus(),60)}
function overviewPage(){return `<div class="print-title"><h2>مجتمع اندیشه — وضعیت شارژ همه واحدها</h2></div><section class="hero"><small>نمای کلی مدیریت</small><h1>وضعیت ۲۱۰ واحد</h1><p>در این جدول همه ماه‌ها از تیر تا اسفند کنار هم دیده می‌شوند. مبلغ داخل هر خانه «پرداخت همان ماه» است.</p></section><div class="stats"><div class="card stat"><small>واحدها</small><b>${db.units.length}</b></div><div class="card stat"><small>کل پرداخت</small><b class="good">${money(db.units.reduce((s,u)=>s+paid(u),0))}</b></div><div class="card stat"><small>بدهی پیشین</small><b class="bad">${money(db.units.reduce((s,u)=>s+(+u.opening||0),0))}</b></div><div class="card stat"><small>شارژ هر دوره</small><b>${money(totalCharge())}</b></div></div><div class="card"><div class="toolbar"><div><h2>فهرست همه واحدها</h2><div class="hint">برای ویرایش نام، تلفن، بدهی یا پرداخت ماه، روی «ویرایش» بزن.</div></div><div class="actions noprint"><button class="btn light" onclick="printCurrent()">چاپ</button><button class="btn" onclick="tab('charges')">تعیین شارژ ماه‌ها</button></div></div><div class="table-wrap" style="margin-top:9px"><table class="table compact overview-table"><thead><tr><th>واحد</th><th>نام</th><th>بدهی</th>${months.map(m=>`<th class="center"><span class="month-head">${m}</span><small>${money(chargeFor(m))}</small></th>`).join('')}</tr></thead><tbody>${db.units.map(u=>overviewRow(u)).join('')}</tbody></table></div></div>`}
function overviewRow(u){return `<tr><td class="center"><b>${esc(u.id)}</b></td><td title="${esc(u.name||'بدون نام')}">${esc(u.name||'—')}</td><td class="center">${money(u.opening)}</td>${months.map(m=>`<td class="pay-cell"><input value="${monthPaid(u,m)||''}" inputmode="numeric" placeholder="—" onchange="setPaymentQuick('${esc(u.id)}','${m}',this.value)"></td>`).join('')}</tr>`}
async function setPaymentQuick(id,m,v){const u=unit(id);if(!u)return;const amount=+String(v).replace(/,/g,'')||0;u.payments=u.payments.filter(p=>p.month!==m);if(amount)u.payments.push({month:m,amount,date:'',method:'',ref:''});save();try{await cloudPayments()}catch(e){toast('ذخیره ابری پرداخت ناموفق بود')}renderOverviewBody();toast('پرداخت ذخیره شد')}
function renderOverviewBody(){const tb=document.querySelector('.overview-table tbody');if(tb)tb.innerHTML=db.units.map(u=>overviewRow(u)).join('')}
function chargesPage(){return `<div class="card"><div class="toolbar"><div><h2>شارژ هر ماه</h2><div class="hint">اینجا فقط مبلغ شارژ هر ماه را یک‌بار دستی وارد کن. این مبلغ برای همه واحدها در محاسبه وضعیت استفاده می‌شود.</div></div><div class="actions noprint"><button class="btn" onclick="saveMonthlyCharges()">ذخیره شارژها</button><button class="btn light" onclick="printCurrent()">چاپ</button></div></div><div class="month-grid" style="margin-top:12px">${months.map(m=>`<div class="month-box"><b>${m}</b><label>مبلغ شارژ</label><input id="charge_${m}" class="input" type="number" value="${chargeFor(m)}" inputmode="numeric" placeholder="مثلاً 500000"></div>`).join('')}</div><div class="hint" style="margin-top:12px">پس از ذخیره، صفحه اصلی مدیریت و پنل ساکنین همین مبالغ را به‌عنوان شارژ ماهانه نشان می‌دهند.</div></div>`}
async function saveMonthlyCharges(){months.forEach(m=>monthlyCharges[m]=+document.getElementById('charge_'+m).value||0);saveMonthly();db.units.forEach(u=>{u.charges={};months.forEach(m=>u.charges[m]=chargeFor(m))});save();try{await cloudCharges()}catch(e){toast('شارژها محلی ذخیره شدند؛ ذخیره ابری ناموفق بود')}toast('شارژ ماه‌ها ذخیره شد');tab('overview')}
function unitsPage(){return `<div class="card"><div class="toolbar"><div><h2>ویرایش اطلاعات واحدها</h2><div class="hint">ترتیب این فهرست ثابت است؛ شماره واحد را هر عددی خواستی بگذار، حتی ۱۰۶۱۹. تغییر شماره، جای ردیف را عوض نمی‌کند.</div></div><div class="actions noprint"><button class="btn light" onclick="printCurrent()">چاپ</button></div></div><div class="search noprint"><input id="unitSearch" class="input" placeholder="جستجو با شماره واحد، نام یا تلفن" oninput="renderUnitTable()"></div><div class="table-wrap"><table class="table"><thead><tr><th style="width:75px">شماره واحد</th><th>نام</th><th>تلفن</th><th style="width:95px">بدهی پیشین</th><th style="width:70px">پرداخت</th><th class="no-print">عملیات</th></tr></thead><tbody id="unitRows"></tbody></table></div></div>`}
function renderUnitTable(){const q=(document.getElementById('unitSearch')?.value||'').trim().toLowerCase();const arr=db.units.filter(u=>String(u.id).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q));const el=document.getElementById('unitRows');if(!el)return;el.innerHTML=arr.map(u=>`<tr><td><input id="id_${esc(u.id)}" class="inline" value="${esc(u.id)}" inputmode="numeric"></td><td><input id="name_${esc(u.id)}" class="inline" value="${esc(u.name||'')}"></td><td><input id="phone_${esc(u.id)}" class="inline" value="${esc(u.phone||'')}" inputmode="tel"></td><td><input id="open_${esc(u.id)}" class="inline" value="${+u.opening||0}" inputmode="numeric"></td><td class="center">${money(paid(u))}</td><td class="no-print"><button class="btn" onclick="saveInline('${esc(u.id)}')">ذخیره</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">موردی پیدا نشد.</td></tr>'}
async function saveInline(oldId){const u=unit(oldId);if(!u)return;const newId=document.getElementById('id_'+oldId).value.trim();if(!/^\d+$/.test(newId)||newId==='0')return toast('شماره واحد باید یک عدد مثبت باشد');if(newId!==String(oldId)&&unit(newId))return toast('این شماره واحد قبلاً استفاده شده است');const old=u.id;u.slot=(u.slot??db.units.indexOf(u));u.id=newId;u.name=document.getElementById('name_'+oldId).value.trim();u.phone=document.getElementById('phone_'+oldId).value.trim();u.opening=+document.getElementById('open_'+oldId).value||0;save();try{await cloudUnit(u);if(String(old)!==String(newId))await SB('units?id=eq.'+encodeURIComponent(old),{method:'DELETE'});await cloudCharges();await cloudPayments()}catch(e){console.error(e);toast('ذخیره ابری ناموفق بود')}toast('اطلاعات ذخیره شد');renderUnitTable()}
function searchPage(){return `<div class="card"><div class="toolbar"><div><h2>جستجوی واحد</h2><div class="hint">شماره تلفن، نام یا شماره واحد را وارد کن.</div></div><button class="btn light noprint" onclick="printCurrent()">چاپ</button></div><div class="search noprint"><input id="globalSearch" class="input" inputmode="search" placeholder="مثلاً 0912... یا نام یا شماره واحد" oninput="renderSearch()"></div><div id="searchResult" class="result"><div class="empty">برای شروع جستجو چیزی بنویس.</div></div></div>`}
function renderSearch(){const q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();const box=document.getElementById('searchResult');if(!q){box.innerHTML='<div class="empty">شماره تلفن، نام یا شماره واحد را وارد کن.</div>';return}const found=db.units.filter(u=>String(u.id).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q));box.innerHTML=found.length?found.map(searchCard).join(''):'<div class="empty">موردی پیدا نشد.</div>'}
function searchCard(u){return `<div class="card" style="margin-top:9px"><div class="toolbar"><div><h2>واحد ${esc(u.id)} — ${esc(u.name||'بدون نام')}</h2><div class="hint">تلفن: ${esc(u.phone||'ثبت نشده')} • بدهی پیشین: ${money(u.opening)} تومان</div></div><div class="actions noprint"><button class="btn" onclick="openUnit('${esc(u.id)}')">ویرایش</button><button class="btn light" onclick="printUnit('${esc(u.id)}')">چاپ</button></div></div><div class="table-wrap" style="margin-top:9px"><table class="table"><tr><th>ماه</th>${months.map(m=>`<th class="center">${m}</th>`).join('')}</tr><tr><td>پرداخت</td>${months.map(m=>`<td class="center">${money(monthPaid(u,m))}</td>`).join('')}</tr><tr><td>وضعیت</td>${months.map(m=>{const c=chargeFor(m),p=monthPaid(u,m);return `<td class="center"><span class="status ${c&&p>=c?'ok':p?'partial':c?'bad':''}">${c&&p>=c?'تسویه':p?'جزئی':c?'بدهکار':'—'}</span></td>`}).join('')}</tr></table></div></div>`}
function openUnit(id){const u=unit(id);if(!u)return;showModal(`<div class="toolbar"><h2>ویرایش واحد ${esc(u.id)}</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="detail-grid"><div class="field"><label>شماره واحد</label><input id="m_id" class="input" value="${esc(u.id)}" inputmode="numeric"></div><div class="field"><label>نام</label><input id="m_name" class="input" value="${esc(u.name||'')}"></div><div class="field"><label>شماره تلفن</label><input id="m_phone" class="input" value="${esc(u.phone||'')}" inputmode="tel"></div><div class="field"><label>بدهی پیشین</label><input id="m_open" class="input" type="number" value="${+u.opening||0}"></div><div class="field"><label>رمز ساکن</label><input id="m_pass" class="input" type="text" value="${esc(u.password||'')}"></div></div><h3 style="font-size:13px">پرداخت ماهانه</h3><div class="table-wrap"><table class="table"><tr><th>ماه</th>${months.map(m=>`<th class="center">${m}</th>`).join('')}</tr><tr><td>پرداخت</td>${months.map(m=>`<td class="center"><input id="p_${m}" class="inline" value="${monthPaid(u,m)||''}" inputmode="numeric"></td>`).join('')}</tr></table></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="saveModal('${esc(u.id)}')">ذخیره همه تغییرات</button><button class="btn light" onclick="printUnit('${esc(u.id)}')">چاپ</button></div>`)}
async function saveModal(oldId){const u=unit(oldId);if(!u)return;const newId=document.getElementById('m_id').value.trim();if(!/^\d+$/.test(newId)||newId==='0')return toast('شماره واحد باید یک عدد مثبت باشد');if(newId!==String(oldId)&&unit(newId))return toast('این شماره واحد قبلاً استفاده شده است');const old=u.id;u.slot=(u.slot??db.units.indexOf(u));u.id=newId;u.name=document.getElementById('m_name').value.trim();u.phone=document.getElementById('m_phone').value.trim();u.opening=+document.getElementById('m_open').value||0;u.password=document.getElementById('m_pass').value;months.forEach(m=>{const a=+document.getElementById('p_'+m).value||0;u.payments=u.payments.filter(p=>p.month!==m);if(a)u.payments.push({month:m,amount:a,date:'',method:'',ref:''})});save();try{await cloudUnit(u);if(String(old)!==String(newId))await SB('units?id=eq.'+encodeURIComponent(old),{method:'DELETE'});await cloudCharges();await cloudPayments()}catch(e){toast('ذخیره محلی انجام شد؛ ذخیره ابری ناموفق بود')}closeModal();toast('تغییرات ذخیره شد');renderSearch();}
function passwordPage(){return `<div class="card"><div class="toolbar"><div><h2>رمزهای ساکنین</h2><div class="hint">رمزها را مشاهده یا ویرایش کن.</div></div><button class="btn light noprint" onclick="printPasswords()">چاپ رمزها</button></div><div class="table-wrap" style="margin-top:9px"><table class="table compact"><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th><th class="no-print"></th></tr>${db.units.map(u=>`<tr class="password-print"><td class="center">${esc(u.id)}</td><td>${esc(u.name||'—')}</td><td>${esc(u.phone||'—')}</td><td><input class="inline" value="${esc(u.password||'')}" onchange="setPassword('${esc(u.id)}',this.value)"></td><td class="no-print"><button class="btn light" onclick="openUnit('${esc(u.id)}')">ویرایش</button></td></tr>`).join('')}</table></div></div>`}
async function setPassword(id,v){const u=unit(id);if(!u)return;u.password=v;save();try{await cloudUnit(u);toast('رمز ذخیره شد')}catch(e){toast('رمز محلی ذخیره شد؛ ابری ناموفق بود')}}
function printUnit(id){const u=unit(id);if(!u)return;const w=window.open('','_blank');if(!w)return toast('مرورگر اجازه چاپ نداد');const rows=months.map(m=>`<tr><td>${m}</td><td>${money(chargeFor(m))}</td><td>${money(monthPaid(u,m))}</td><td>${money(Math.max(chargeFor(m)-monthPaid(u,m),0))}</td></tr>`).join('');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>واحد ${esc(u.id)}</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:right;font-size:11px}</style></head><body><h2>مجتمع اندیشه — واحد ${esc(u.id)}</h2><p>نام: ${esc(u.name||'—')}<br>تلفن: ${esc(u.phone||'—')}<br>بدهی پیشین: ${money(u.opening)} تومان</p><table><tr><th>ماه</th><th>شارژ</th><th>پرداخت</th><th>مانده</th></tr>${rows}</table><script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()}
function printPasswords(){const pages=[db.units.slice(0,105),db.units.slice(105)];const tables=pages.map((list,i)=>`<section class="page"><h2>مجتمع اندیشه — رمز ورود ساکنین <small>(${i+1} از 2)</small></h2><table><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th></tr>${list.map(u=>`<tr><td>${esc(u.id)}</td><td>${esc(u.name||'—')}</td><td>${esc(u.phone||'—')}</td><td><b>${esc(u.password||'')}</b></td></tr>`).join('')}</table></section>`).join('');const w=window.open('','_blank');if(!w)return toast('مرورگر اجازه چاپ نداد');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>رمزهای مجتمع اندیشه</title><style>@page{size:A4;margin:8mm}*{box-sizing:border-box}body{font-family:Arial;padding:0;margin:0}.page{height:calc(297mm - 16mm);break-after:page;page-break-after:always}.page:last-child{break-after:auto;page-break-after:auto}h2{font-size:14px;margin:0 0 7px}h2 small{font-size:8px;color:#777}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:3px 4px;text-align:right;font-size:7.5px;line-height:1.15}tr{break-inside:avoid}</style></head><body>${tables}<script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()}
function showModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
</script>
<script src="supabase-config.js"></script>
<script>
async function SB(path,opt={}){const h=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(!r.ok)throw Error(await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}
async function cloudLoad(){try{const us=await SB('units?select=*&order=slot.asc.nullslast,id.asc');const localById=new Map(db.units.map(u=>[String(u.id),u]));const loaded=[];for(let i=0;i<(us||[]).length;i++){const r=us[i];let u=localById.get(String(r.id));if(!u){u={id:r.id,name:'',phone:'',password:'',opening:0,area:'',floor:'',owner:'',tenant:'',parking:'',storage:'',carIran:'',carMid:'',carLetter:'',carEnd:'',carName:'',carColor:'',notes:'',charges:{},payments:[]}}Object.assign(u,{id:r.id,name:r.name??u.name??'',phone:r.phone??u.phone??'',password:r.password??u.password??'',opening:+(r.opening||0),slot:r.slot??i});u.charges=u.charges||{};u.payments=Array.isArray(u.payments)?u.payments:[];loaded.push(u)}if(loaded.length)db.units=loaded;const cs=await SB('charges?select=unit_id,month,amount');for(const u of db.units)u.charges={};for(const r of cs||[]){const u=unit(r.unit_id);if(u&&months.includes(r.month)){u.charges[r.month]=+(r.amount||0);if(!monthlyCharges[r.month])monthlyCharges[r.month]=+(r.amount||0)}}const ps=await SB('payments?select=unit_id,month,amount,payment_date,method,reference&order=id.asc');db.units.forEach(u=>u.payments=[]);for(const r of ps||[]){const u=unit(r.unit_id);if(u&&months.includes(r.month))u.payments.push({month:r.month,amount:+(r.amount||0),date:r.payment_date||'',method:r.method||'',ref:r.reference||''})}saveMonthly();save();return true}catch(e){console.error('Supabase load error:',e);return false}}
async function cloudUnit(u){const slot=(u.slot??db.units.indexOf(u));return SB('units?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:Number(u.id),slot:Number(slot),name:u.name||'',phone:u.phone||'',password:u.password||'',opening:+(u.opening||0)})})}
async function cloudCharges(){const old=await SB('charges?select=id');for(const r of old||[])await SB('charges?id=eq.'+r.id,{method:'DELETE'});const rows=[];for(const u of db.units)for(const m of months){const a=chargeFor(m);if(a)rows.push({unit_id:Number(u.id),month:m,amount:a})}if(rows.length)await SB('charges',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)})}
async function cloudPayments(){const old=await SB('payments?select=id');for(const r of old||[])await SB('payments?id=eq.'+r.id,{method:'DELETE'});const rows=[];for(const u of db.units)for(const p of u.payments)rows.push({unit_id:Number(u.id),month:p.month||'',amount:+(p.amount||0),payment_date:p.date||'',method:p.method||'',reference:p.ref||''});if(rows.length)await SB('payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)})}
(async()=>{const ok=await cloudLoad();if(!ok)toast('اتصال Supabase برقرار نشد؛ اطلاعات محلی نمایش داده می‌شود');db.units.forEach(u=>{u.charges={};months.forEach(m=>u.charges[m]=chargeFor(m))});save();login('resident')})()
</script>
