<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>مجتمع اندیشه</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0%,#eef3ff 0,#f4f7fb 34%,#f4f7fb 100%);color:#101827;font-family:Estedad,Vazirmatn,Tahoma,Arial,sans-serif;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}
.wrap{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:#101827;color:#fff;display:grid;place-items:center;font-size:20px}.brand b{display:block;font-size:15px}.brand small{color:#788397;font-size:9px}.adminlink{font-size:8px;color:#aab2bf;text-decoration:none}
.hero{background:linear-gradient(135deg,#101827 0%,#263b67 62%,#38559a 100%);color:#fff;border-radius:24px;padding:23px;box-shadow:0 16px 40px #18264b18;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid #ffffff18;border-radius:50%;left:-70px;top:-90px}.hero small{color:#c9d3e5}.hero h1{margin:7px 0;font-size:24px}.hero p{margin:0;color:#d8e0ee;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card{background:#fff;border:1px solid #e4e8ef;border-radius:17px;padding:14px;box-shadow:0 7px 25px #18264b08}.stat small{color:#7a8495;font-size:9px}.stat b{display:block;font-size:20px;margin-top:8px}.bad{color:#d54b60}.good{color:#15936c}
.nav{display:flex;gap:6px;overflow:auto;margin:10px 0}.nav button{background:#fff;border:1px solid #e2e7ef;border-radius:10px;padding:8px 11px;font-size:10px;white-space:nowrap}.nav button.on{background:#eaf0ff;border-color:#cbd8ff;color:#284ba9}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.field label{font-size:9px;color:#657085;display:block;margin-bottom:4px}.input,.select,.area{width:100%;border:1px solid #dfe5ed;background:#fff;border-radius:10px;padding:9px;outline:none}.input:focus{border-color:#7188d8;box-shadow:0 0 0 3px #3157d514}.btn{border:0;border-radius:10px;background:#3157d5;color:#fff;padding:9px 13px;font-size:10px;font-weight:700}.btn.light{background:#eef2f7;color:#344054}.btn.red{background:#fff0f2;color:#bf3347}.btn.selected{background:#3157d5;color:#fff}.tablebox{overflow:auto;border:1px solid #e3e7ee;border-radius:12px;margin-top:10px}.table{width:100%;border-collapse:collapse;min-width:680px}.table th,.table td{font-size:9px;padding:9px;border-bottom:1px solid #edf0f4;text-align:right}.table th{background:#fafbfc;color:#697386}.pill{font-size:8px;border-radius:99px;padding:4px 7px;background:#eef2f6}.pill.bad{background:#ffebef}.pill.good{background:#e6f7f0}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(390px,100%);background:#fff;border:1px solid #e4e8ef;border-radius:25px;padding:25px;box-shadow:0 18px 60px #10182712}.loginbox h1{font-size:21px;margin:15px 0 4px}.loginbox p{font-size:10px;color:#778296;margin:0 0 18px}.row{margin:10px 0}.row label{font-size:9px;color:#697386;display:block;margin-bottom:4px}.tiny{border:0;background:transparent;color:#a5adba;font-size:8px}
.modal{position:fixed;inset:0;background:#10182777;display:none;place-items:center;padding:14px;z-index:20}.modal.show{display:grid}.modalbox{width:min(800px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:20px;padding:18px}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{font-size:15px;margin:0}.drawer{position:fixed;inset:0;background:#10182766;display:none;z-index:15}.drawer.show{display:block}.drawerbox{position:absolute;right:0;top:0;bottom:0;width:min(520px,95%);background:#fff;padding:18px;overflow:auto}
@media(max-width:700px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:480px){.cards,.grid{grid-template-columns:1fr}.hero{border-radius:20px}}
@media print{.noprint{display:none!important}body{background:#fff}}
</style>
</head>
<body><div id="app"></div><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div><div id="drawer" class="drawer" onclick="if(event.target===this)closeDrawer()"><div id="drawerbox" class="drawerbox"></div></div>
<script src="data.js"></script><script src="supabase-config.js"></script>
<script>
const KEY='andisheh_v4';
let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('andisheh_v3')||'null')||structuredClone(APP_DATA);
if(!db.units) db=structuredClone(APP_DATA);
const months=['تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
for(const u of db.units){if(u.unitNo==null)u.unitNo=u.id;if(!u.charges)u.charges={};if(!u.payments)u.payments=[];if(u.tenantName==null)u.tenantName='';if(u.hasPreviousDebt==null)u.hasPreviousDebt=(+u.opening||0)>0;}
const money=n=>new Intl.NumberFormat('fa-IR').format(+n||0)+' تومان';
const unit=id=>db.units.find(u=>u.id==id);
const byUnitNo=no=>db.units.find(u=>String(u.unitNo)===String(no));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const charges=u=>months.reduce((s,m)=>s+(+u.charges[m]||0),0), paid=u=>u.payments.reduce((s,p)=>s+(+p.amount||0),0);
const bal=u=>(+u.opening||0)+charges(u)-paid(u), stat=u=>bal(u)>0?'بدهکار':bal(u)<0?'طلبکار':'تسویه';
function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;bottom:15px;right:15px;background:#101827;color:#fff;padding:10px 14px;border-radius:10px;font-size:10px;z-index:50';document.body.appendChild(x)}x.textContent=t;clearTimeout(window._tt);window._tt=setTimeout(()=>x.remove(),2600)}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function login(kind='resident'){const admin=kind==='admin';document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div style="text-align:center"><div class="logo" style="margin:auto">🏢</div><div style="font-size:10px;color:#758195;margin-top:7px">سامانه مجتمع اندیشه</div></div><h1>${admin?'ورود مدیر':'ورود ساکن'}</h1><p>${admin?'مدیریت کامل اطلاعات مجتمع':'ورود با شماره واحد و رمز شخصی'}</p><form onsubmit="event.preventDefault();doLogin('${kind}')" autocomplete="${admin?'on':'off'}"><div class="row"><label>${admin?'نام کاربری':'شماره واحد'}</label><input id="lid" class="input" ${admin?'type="text" autocomplete="username" inputmode="text"':'type="text" inputmode="numeric"'} placeholder="${admin?'admin':'مثلاً ۱۲۳'}" autofocus></div><div class="row"><label>${admin?'رمز عبور مدیر':'رمز شخصی'}</label><input id="lp" class="input" type="password" ${admin?'autocomplete="current-password" inputmode="text"':'inputmode="numeric"'} placeholder="${admin?'رمز عبور را تایپ کنید':'رمز ۶ رقمی'}"></div><button class="btn" type="submit" style="width:100%;margin-top:8px">ورود</button></form><div style="text-align:center;margin-top:14px"><button class="tiny" onclick="login('${admin?'resident':'admin'}')">${admin?'ورود ساکن':'مدیریت'}</button></div></div></div>`;setTimeout(()=>document.getElementById('lid')?.focus(),50)}
function doLogin(kind){let id=document.getElementById('lid').value.trim(),pw=document.getElementById('lp').value;if(kind==='admin'){if(id==='admin'&&pw==='eskandari1234')admin();else toast('نام کاربری یا رمز مدیر نادرست است')}else{let u=byUnitNo(id);if(u&&u.password===pw)resident(u);else toast('شماره واحد یا رمز نادرست است')}}
function header(title,sub){return `<div class="top"><div class="brand"><div class="logo">🏢</div><div><b>${title}</b><small>${sub}</small></div></div><a class="adminlink" href="#" onclick="event.preventDefault();login('admin')">مدیر</a></div>`}
function hasPayment(u,m){return u.payments.some(p=>p.month===m)}
function monthPaid(u,m){return u.payments.filter(p=>p.month===m).reduce((s,p)=>s+(+p.amount||0),0)}
function monthStatus(u,m){const due=+(u.charges[m]||0), p=monthPaid(u,m);if(hasPayment(u,m)&&!due)return {text:'پرداخت شده',cls:'good'};if(!due)return {text:'بدون شارژ',cls:''};if(p>=due)return {text:'پرداخت کامل',cls:'good'};if(p>0)return {text:'پرداخت ناقص',cls:'bad'};return {text:'پرداخت نشده',cls:'bad'}}
function resident(u){document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','حساب شخصی • واحد '+u.unitNo)}<section class="hero"><small>حساب شما</small><h1>${u.name||'ساکن گرامی'}</h1><p>اینجا می‌توانید وضعیت شارژ، پرداخت‌ها، بدهی و مشخصات واحد را ببینید.</p></section><div class="cards"><div class="card stat"><small>مانده حساب</small><b class="${bal(u)>0?'bad':'good'}">${money(Math.abs(bal(u)))}</b><small>${stat(u)}</small></div><div class="card stat"><small>بدهی پیشین</small><b class="${(+u.opening||0)>0?'bad':'good'}">${u.hasPreviousDebt?money(+u.opening||0):'ندارد'}</b><small>${u.hasPreviousDebt?'ثبت شده':'بدون بدهی پیشین'}</small></div><div class="card stat"><small>پرداخت ثبت‌شده</small><b>${money(paid(u))}</b></div></div><div class="card"><h3 style="font-size:13px">وضعیت پرداخت شارژ ماهانه</h3><div class="tablebox"><table class="table"><tr><th>ماه</th><th>مبلغ شارژ</th><th>پرداخت</th><th>وضعیت</th></tr>${months.map(m=>{const st=monthStatus(u,m);return `<tr><td>${m}</td><td>${money(u.charges[m]||0)}</td><td>${money(monthPaid(u,m))}</td><td><span class="pill ${st.cls}">${st.text}</span></td></tr>`}).join('')}</table></div></div><div class="card"><h3 style="font-size:13px">سوابق پرداخت</h3><div class="tablebox"><table class="table"><tr><th>ماه پرداخت‌شده</th><th>مبلغ شارژ</th></tr>${u.payments.map(p=>`<tr><td>${p.month||'—'}</td><td>${money(p.amount)}</td></tr>`).join('')||'<tr><td colspan="2">هنوز پرداختی ثبت نشده</td></tr>'}</table></div></div><div class="card" style="margin-top:10px"><h3 style="font-size:13px">مشخصات ساکن</h3><div class="grid"><div><small>نام ساکن</small><br>${u.name||'—'}</div><div><small>تلفن</small><br>${u.phone||'—'}</div><div><small>وضعیت</small><br>${u.isOwner?'مالک':'مستأجر'}</div><div><small>نام مستأجر</small><br>${u.isOwner?'—':(u.tenantName||'—')}</div></div></div><div style="text-align:center;margin:18px"><button class="tiny" onclick="login('resident')">خروج</button></div></main>`}
function admin(){document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','پنل مدیریت • ۲۱۰ واحد')}<div class="nav" id="nav">${[['dash','داشبورد'],['units','واحدها'],['pay','پرداخت‌ها'],['charge','شارژ'],['reports','گزارش‌ها'],['passwords','رمزها']].map(x=>`<button onclick="tab('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="syncAll()">☁ همگام‌سازی</button></div><div id="content"></div></main>`;tab('dash')}
function tab(t){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',['dash','units','pay','charge','reports','passwords'][i]===t));let c=document.getElementById('content');c.innerHTML=t==='dash'?dashboard():t==='units'?unitsPage():t==='pay'?paymentsPage():t==='charge'?chargePage():t==='reports'?reportsPage():passwordPage()}
function dashboard(){let debt=db.units.filter(u=>bal(u)>0),sum=debt.reduce((s,u)=>s+bal(u),0);return `<section class="hero"><small>مدیریت مجتمع</small><h1>کنترل ساده‌ی ۲۱۰ واحد</h1><p>اطلاعات با Supabase همگام می‌شود و شماره واحد از شناسه داخلی دیتابیس جداست.</p></section><div class="cards"><div class="card stat"><small>واحدها</small><b>۲۱۰</b></div><div class="card stat"><small>بدهکاران</small><b class="bad">${debt.length}</b></div><div class="card stat"><small>جمع بدهی</small><b class="bad">${money(sum)}</b></div></div><div class="card"><h3 style="font-size:13px">عملیات سریع</h3><div class="grid"><button class="btn" onclick="tab('units')">ویرایش واحدها</button><button class="btn" onclick="openPayment()">ثبت پرداخت</button><button class="btn" onclick="tab('reports')">گزارش مالی</button><button class="btn" onclick="printPasswords()">PDF رمزها</button></div></div>`}
function unitsPage(){return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><h3 style="font-size:13px">۲۱۰ واحد</h3><button class="btn" onclick="generateMissingPasswords()">تولید رمزهای خالی</button></div><input id="uq" class="input" style="margin-top:10px" oninput="filterUnits()" placeholder="جستجوی واحد، نام، تلفن"><div class="tablebox"><table class="table"><thead><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th><th>مانده</th><th></th></tr></thead><tbody id="ur">${unitRows(db.units)}</tbody></table></div></div>`}
function unitRows(a){return a.slice().map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${u.phone||'—'}</td><td>${u.password}</td><td>${money(Math.abs(bal(u)))}</td><td><button class="btn light" onclick="editUnit(${u.id})">ویرایش</button></td></tr>`).join('')}
function filterUnits(){let q=document.getElementById('uq').value.toLowerCase();document.getElementById('ur').innerHTML=unitRows(db.units.filter(u=>String(u.unitNo).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q)).slice(0,120))}
function editUnit(id){let u=unit(id);showModal(`<div class="modalhead"><h2>ویرایش واحد ${u.unitNo}</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="field" style="margin-top:13px"><label>شماره واحد</label><input id="e_unitNo" class="input" type="text" inputmode="numeric" value="${u.unitNo}"><small style="display:block;color:#758195;font-size:8px;margin-top:4px">شماره واحد قابل تغییر است؛ اگر شماره مقصد قبلاً وجود داشته باشد، شماره دو واحد جابه‌جا می‌شود.</small></div><div class="grid" style="margin-top:13px"><div class="field"><label>نام ساکن</label><input id="e_name" class="input" value="${esc(u.name)}"></div><div class="field"><label>نام مستأجر</label><input id="e_tenantName" class="input" value="${esc(u.tenantName)}" ${u.isOwner?'disabled':''}></div><div class="field"><label>تلفن ساکن</label><input id="e_phone" class="input" inputmode="tel" value="${esc(u.phone)}"></div><div class="field"><label>رمز شخصی ساکن</label><input id="e_password" class="input" type="text" value="${esc(u.password)}" autocomplete="off"></div></div><div class="card" style="margin-top:12px;padding:12px;background:#f8fafc"><label style="display:flex;align-items:center;gap:9px;font-size:10px;font-weight:700;cursor:pointer"><input id="e_hasDebt" type="checkbox" ${(u.hasPreviousDebt||(+u.opening||0)>0)?'checked':''} onchange="updatePreviousDebt()"> آیا بدهی پیشین دارد؟</label><div class="field" style="margin-top:10px"><label>مبلغ بدهی پیشین</label><input id="e_opening" class="input" type="number" min="0" inputmode="numeric" value="${+u.opening||0}" ${(u.hasPreviousDebt||(+u.opening||0)>0)?'':'disabled'} placeholder="مثلاً ۵۰۰۰۰۰"></div><div id="debtStatus" style="margin-top:7px;font-size:9px;color:#657085"></div></div><div class="card" style="margin-top:12px;padding:12px;background:#f8fafc"><label style="display:flex;align-items:center;gap:9px;font-size:10px;font-weight:700;cursor:pointer"><input id="e_isOwner" type="checkbox" ${u.isOwner?'checked':''} onchange="updateResidentType()"> خودِ شخص مالک است</label><div id="tenantStatus" style="margin-top:8px;font-size:9px;color:#657085">${u.isOwner?'این ساکن مالک واحد است؛ بخش مستأجر غیرفعال است.':'این ساکن مستأجر واحد است.'}</div></div><button class="btn" style="margin-top:13px" onclick="saveUnit(${id})">ذخیره</button>`);updateResidentType();updatePreviousDebt()}
function updatePreviousDebt(){const cb=document.getElementById('e_hasDebt'),inp=document.getElementById('e_opening'),box=document.getElementById('debtStatus');if(!cb||!inp)return;inp.disabled=!cb.checked;inp.style.background=cb.checked?'#fff':'#f1f3f6';inp.style.cursor=cb.checked?'text':'not-allowed';if(!cb.checked)inp.value='';if(box)box.textContent=cb.checked?'بدهی پیشین این واحد را وارد کنید.':'این واحد بدهی پیشین ندارد.';}
function updateResidentType(){const cb=document.getElementById('e_isOwner');const box=document.getElementById('tenantStatus');const tenant=document.getElementById('e_tenantName');if(!cb||!box)return;box.textContent=cb.checked?'این ساکن مالک واحد است؛ بخش نام مستأجر غیرفعال است.':'این ساکن مستأجر واحد است؛ نام مستأجر را وارد کنید.';box.style.opacity=cb.checked?'0.55':'1';if(tenant){tenant.disabled=cb.checked;tenant.style.background=cb.checked?'#f1f3f6':'#fff';tenant.style.cursor=cb.checked?'not-allowed':'text';if(cb.checked)tenant.value=''}}

async function saveUnit(id){
let u=unit(id);if(!u)return;
const fa='۰۱۲۳۴۵۶۷۸۹',ar='٠١٢٣٤٥٦٧٨٩';
const norm=v=>String(v??'').trim().replace(/[۰-۹]/g,c=>fa.indexOf(c)).replace(/[٠-٩]/g,c=>ar.indexOf(c));
let newNo=norm(document.getElementById('e_unitNo').value);
if(!/^\d+$/.test(newNo)||+newNo<1)return toast('شماره واحد معتبر نیست');
let target=byUnitNo(newNo);if(target&&target.id===u.id)target=null;
const oldU=structuredClone(u),oldT=target?structuredClone(target):null,oldNo=u.unitNo;
u.name=document.getElementById('e_name').value.trim();
u.tenantName=document.getElementById('e_tenantName')?.value.trim()||'';
u.phone=document.getElementById('e_phone').value.trim();
u.password=document.getElementById('e_password').value.trim();
u.isOwner=document.getElementById('e_isOwner').checked;
const hasDebt=document.getElementById('e_hasDebt')?.checked||false;
u.hasPreviousDebt=hasDebt;
u.opening=hasDebt?(+document.getElementById('e_opening')?.value||0):0;
if(u.isOwner)u.tenantName='';
try{
if(target){const tempU=-(Number(u.id)+1000000),tempT=-(Number(target.id)+2000000);u.unitNo=tempU;target.unitNo=tempT;await cloudUnit(u);await cloudUnit(target);u.unitNo=+newNo;target.unitNo=+oldNo;await cloudUnit(u);await cloudUnit(target)}
else{u.unitNo=+newNo;await cloudUnit(u)}
save();closeModal();tab('units');toast('اطلاعات ساکن و شماره واحد با موفقیت ذخیره شد')
}catch(e){console.error('SAVE UNIT ERROR',e);Object.assign(u,oldU);if(target&&oldT)Object.assign(target,oldT);try{await cloudUnit(u);if(target&&oldT)await cloudUnit(target)}catch(re){console.error('ROLLBACK ERROR',re)}toast('ذخیره نشد: '+(e?.message||'خطای Supabase'))}}

function paymentsPage(){let a=[];db.units.forEach(u=>u.payments.forEach((p,i)=>a.push({...p,unit:u.unitNo,name:u.name||'—',idx:i,id:u.id})));a.reverse();return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:13px">پرداخت‌ها</h3><button class="btn" onclick="openPayment()">＋ ثبت پرداخت</button></div><p style="font-size:9px;color:#758195;margin:7px 0 0">فقط شماره واحد را وارد کنید، نام ساکن نمایش داده می‌شود و ماه پرداخت‌شده را انتخاب کنید.</p><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام ساکن</th><th>ماه پرداخت‌شده</th><th></th></tr>${a.map(p=>`<tr><td>${p.unit}</td><td>${p.name}</td><td>${p.month||'—'}</td><td><button class="btn red" onclick="delPay(${p.id},${p.idx})">حذف</button></td></tr>`).join('')||'<tr><td colspan="4">رکوردی نیست</td></tr>'}</table></div></div>`}
function paymentUnitChanged(){const input=document.getElementById('p_unit'),name=document.getElementById('p_name'),box=document.getElementById('p_months'),u=byUnitNo((input?.value||'').trim());if(!name||!box)return;if(!u){name.value='';box.innerHTML='<div style="font-size:9px;color:#9aa3b1">شماره واحد را وارد کنید.</div>';return}name.value=u.name||'بدون نام';box.innerHTML=months.map(m=>{const paid=monthPaid(u,m);const due=+(u.charges[m]||0);return `<div class="field" style="margin:0"><label style="display:flex;justify-content:space-between;gap:4px"><span>${m}</span><small style="font-size:8px;color:#758195">شارژ: ${money(due)}</small></label><input id="pm_${m}" class="input" type="number" min="0" inputmode="numeric" placeholder="مبلغ پرداختی" value="${paid||''}" oninput="paymentAmountChanged('${m}')"><small id="ps_${m}" style="font-size:8px;color:#758195">${paid?((paid>=due&&due)?'پرداخت کامل':(paid>0?'پرداخت ناقص':'پرداخت نشده')):(due?'پرداخت نشده':'بدون شارژ')}</small></div>`}).join('')}
function paymentAmountChanged(m){const u=byUnitNo((document.getElementById('p_unit')?.value||'').trim());const el=document.getElementById('ps_'+m);if(!u||!el)return;const paid=+(document.getElementById('pm_'+m)?.value||0),due=+(u.charges[m]||0);el.textContent=paid?(paid>=due&&due?'پرداخت کامل':'پرداخت ناقص'):(due?'پرداخت نشده':'بدون شارژ')}
function openPayment(){showModal(`<div class="modalhead"><h2>ثبت پرداخت</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="field" style="margin-top:13px"><label>شماره واحد</label><input id="p_unit" class="input" type="text" inputmode="numeric" placeholder="مثلاً ۱۰۰۵" oninput="paymentUnitChanged()"></div><div class="field" style="margin-top:10px"><label>نام ساکن</label><input id="p_name" class="input" readonly placeholder="بعد از وارد کردن شماره واحد نمایش داده می‌شود"></div><div class="field" style="margin-top:13px"><label>مبلغ پرداختی هر ماه را وارد کنید</label><div id="p_months" class="grid" style="grid-template-columns:repeat(3,1fr);margin-top:6px"></div></div><button class="btn" style="margin-top:13px;width:100%" onclick="savePay()">ثبت پرداخت‌ها</button>`);setTimeout(()=>document.getElementById('p_unit')?.focus(),50)}
async function savePay(){const unitInput=document.getElementById('p_unit'),u=byUnitNo((unitInput?.value||'').trim());if(!u)return toast('ابتدا شماره واحد معتبر وارد کنید');const rows=[];for(const m of months){const amount=+(document.getElementById('pm_'+m)?.value||0);const old=u.payments.find(p=>p.month===m);if(amount>0){rows.push({unit_id:u.id,month:m,amount,payment_date:null,method:'',reference:''})}else if(old){rows.push({unit_id:u.id,month:m,amount:0,payment_date:null,method:'',reference:''})}}if(!rows.length)return toast('حداقل مبلغ یک ماه را وارد کنید');try{const saved=await SB('payments?on_conflict=unit_id,month',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(rows)});for(const r of rows){const existing=u.payments.find(p=>p.month===r.month);if(existing){existing.amount=r.amount}else{const match=(saved||[]).find(x=>x.month===r.month);u.payments.push({id:match?.id||null,month:r.month,amount:r.amount,date:'',method:'',ref:''})}}u.payments=u.payments.filter(p=>months.includes(p.month)&&(+p.amount||0)>0);save();closeModal();tab('pay');toast('پرداخت‌های واحد '+u.unitNo+' با موفقیت ذخیره شد')}catch(e){console.error('PAYMENT SAVE ERROR',e);toast('ثبت پرداخت ناموفق: '+(e?.message||'خطای Supabase'))}}
async function delPay(uid,i){if(!confirm('حذف شود؟'))return;let u=unit(uid);if(!u)return;let p=u.payments[i];try{if(p.id!=null)await SB('payments?id=eq.'+encodeURIComponent(p.id),{method:'DELETE'});else throw Error('شناسه پرداخت پیدا نشد');u.payments.splice(i,1);save();tab('pay');toast('پرداخت حذف شد')}catch(e){console.error(e);toast('حذف ناموفق بود')}}
function chargePage(){return `<div class="card"><h3 style="font-size:13px">شارژ ماهانه هر واحد</h3><p style="font-size:9px;color:#758195">مبلغ هر ماه را وارد کنید. خالی گذاشتن یک ماه یعنی مقدار قبلی همان ماه حفظ می‌شود.</p><div class="grid">${months.map(m=>`<div class="field"><label>${m}</label><input id="cm_${m}" class="input" type="number" min="0" value="${db.units[0]?.charges?.[m]||''}"></div>`).join('')}</div><button class="btn" style="margin-top:13px" onclick="setAllCharges()">اعمال برای ۲۱۰ واحد</button></div>`}
async function setAllCharges(){const before=db.units.map(u=>({id:u.id,charges:{...u.charges}}));const changed=[];months.forEach(m=>{const el=document.getElementById('cm_'+m);if(el&&el.value.trim()!=='')changed.push([m,+el.value||0])});if(!changed.length)return toast('حداقل مبلغ یک ماه را وارد کنید');for(const [m,v] of changed)db.units.forEach(u=>u.charges[m]=v);try{await cloudCharges();save();toast('شارژها برای همه ۲۱۰ واحد ثبت شد')}catch(e){before.forEach(x=>{let u=unit(x.id);if(u)u.charges=x.charges});console.error(e);toast('ذخیره شارژ ناموفق بود: '+(e?.message||''))}}
function reportsPage(){
let a=db.units.slice();
return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h3 style="font-size:13px">گزارش کامل شارژ • تیر تا اسفند</h3><div><button class="btn light" onclick="exportCSV()">Excel</button> <button class="btn" onclick="printReport()">PDF</button></div></div><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>بدهی پیشین</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>جمع پرداخت</th><th>مانده نهایی</th></tr>${a.map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${u.hasPreviousDebt?money(+u.opening||0):'—'}</td>${months.map(m=>{const st=monthStatus(u,m);return `<td><span class="pill ${st.cls}">${st.text}${monthPaid(u,m)?`<br>${money(monthPaid(u,m))}`:''}</span></td>`}).join('')}<td>${money(paid(u))}</td><td>${money(Math.max(0,bal(u)))}</td></tr>`).join('')}</table></div></div>`}

function exportCSV(){let head=['واحد','نام','بدهی پیشین',...months,'جمع پرداخت','مانده نهایی'];let rows=db.units.slice().map(u=>[u.unitNo,u.name,u.hasPreviousDebt?(+u.opening||0):0,...months.map(m=>`${monthStatus(u,m).text} - ${monthPaid(u,m)}`),paid(u),Math.max(0,bal(u))]);let s='\ufeff'+[head,...rows].map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');download(s,'andisheh-report-tir-esfand.csv','text/csv;charset=utf-8')}

function passwordPage(){return `<div class="card"><h3 style="font-size:13px">رمزهای ورود ساکنین</h3><p style="font-size:9px;color:#758195">رمزهای ۶ رقمی هر واحد. شماره واحد از شناسه داخلی جداست.</p><button class="btn" onclick="printPasswords()">نمایش و چاپ PDF رمزها</button><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>رمز شخصی</th></tr>${db.units.slice().map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td><b>${u.password}</b></td></tr>`).join('')}</table></div></div>`}
function printPasswords(){let rows=db.units.slice().map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td><b>${u.password}</b></td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>رمزهای مجتمع اندیشه</title><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:7px;text-align:right;font-size:12px}</style></head><body><h1>مجتمع اندیشه — فهرست رمز ورود ساکنین</h1><table><tr><th>واحد</th><th>نام</th><th>رمز شخصی</th></tr>${rows}</table><script>window.print()<\/script></body></html>`);w.document.close()}
function printReport(){let rows=db.units.slice().map(u=>`<tr><td>${u.unitNo}</td><td>${u.name||'—'}</td><td>${u.hasPreviousDebt?money(+u.opening||0):'—'}</td>${months.map(m=>`<td>${monthStatus(u,m).text}<br>${money(monthPaid(u,m))}</td>`).join('')}<td>${money(paid(u))}</td><td>${money(Math.max(0,bal(u)))}</td></tr>`).join('');let w=window.open('','_blank');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>گزارش تیر تا اسفند مجتمع اندیشه</title><style>body{font-family:Tahoma;padding:15px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #ddd;padding:5px;text-align:right;font-size:8px}h1{font-size:18px}</style></head><body><h1>مجتمع اندیشه — گزارش کامل شارژ تیر تا اسفند</h1><table><tr><th>واحد</th><th>نام</th><th>بدهی پیشین</th>${months.map(m=>`<th>${m}</th>`).join('')}<th>جمع پرداخت</th><th>مانده نهایی</th></tr>${rows}</table><script>window.print()<\/script></body></html>`);w.document.close()}

function showModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function closeDrawer(){document.getElementById('drawer').classList.remove('show')}
function download(c,n,t){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function SB(path,opt={}){const h=Object.assign({'apikey':SUPABASE_KEY,'Content-Type':'application/json','Accept':'application/json'},opt.headers||{});delete h.Authorization;const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(!r.ok){let msg='HTTP '+r.status;try{const t=await r.text();if(t)msg+=' — '+t}catch(_){}throw Error(msg)}const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}
async function cloudLoad(){const us=await SB('units?select=id,unit_no,name,tenant_name,phone,password,is_owner,opening,has_previous_debt&order=id.asc');if(!Array.isArray(us)||!us.length)throw Error('Supabase units returned no rows');const fresh=structuredClone(APP_DATA);if(!fresh.units||fresh.units.length<1)throw Error('APP_DATA is empty');for(const r of us){let u=fresh.units.find(x=>x.id==r.id);if(!u)continue;Object.assign(u,{unitNo:r.unit_no==null?r.id:+r.unit_no,name:r.name||'',tenantName:r.tenant_name||'',phone:r.phone||'',password:r.password||u.password,isOwner:!!r.is_owner,opening:+(r.opening||0),hasPreviousDebt:r.has_previous_debt==null?(+(r.opening||0)>0):!!r.has_previous_debt});u.charges={};u.payments=[]}const cs=await SB('charges?select=unit_id,month,amount');for(const r of cs||[]){const u=fresh.units.find(x=>x.id==r.unit_id);if(u&&r.month)u.charges[r.month]=+(r.amount||0)}const ps=await SB('payments?select=id,unit_id,month,amount,payment_date,method,reference&order=id.asc');for(const r of ps||[]){const u=fresh.units.find(x=>x.id==r.unit_id);if(u)u.payments.push({id:r.id,month:r.month||'',amount:+(r.amount||0),date:r.payment_date||'',method:r.method||'',ref:r.reference||''})}db=fresh;for(const u of db.units){if(u.unitNo==null)u.unitNo=u.id;if(!u.charges)u.charges={};if(!u.payments)u.payments=[];if(u.isOwner==null)u.isOwner=false;if(u.tenantName==null)u.tenantName='';if(u.hasPreviousDebt==null)u.hasPreviousDebt=(+u.opening||0)>0}save();return true}
async function cloudUnit(u){return SB('units?id=eq.'+encodeURIComponent(u.id),{method:'PATCH',headers:{'Prefer':'return=minimal'},body:JSON.stringify({unit_no:+u.unitNo,name:u.name||'',tenant_name:u.isOwner?'':(u.tenantName||''),phone:u.phone||'',password:u.password||'',is_owner:!!u.isOwner,opening:+(u.opening||0),has_previous_debt:!!u.hasPreviousDebt})})}

async function cloudCharges(){const rows=[];for(const u of db.units)for(const m of months)rows.push({unit_id:u.id,month:m,amount:+(u.charges[m]||0)});if(!rows.length)return;await SB('charges?on_conflict=unit_id,month',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function cloudPayments(){const wanted=new Map();for(const u of db.units)for(const p of u.payments){const m=p.month||'';const amount=+p.amount||0;if(months.includes(m)&&amount>0)wanted.set(u.id+'|'+m,{unit_id:u.id,month:m,amount,payment_date:p.date||null,method:p.method||'',reference:p.ref||''})}const rows=[...wanted.values()];if(rows.length)await SB('payments?on_conflict=unit_id,month',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)})}
async function syncAll(){try{for(const u of db.units)await cloudUnit(u);await cloudCharges();await cloudPayments();save();toast('همه اطلاعات با موفقیت در Supabase ذخیره شد')}catch(e){console.error(e);toast('همگام‌سازی ناموفق بود')}}
(async()=>{try{await cloudLoad();toast('اطلاعات از Supabase بارگذاری شد')}catch(e){console.error('SUPABASE ERROR:',e);toast('خطای Supabase: '+(e?.message||'اتصال برقرار نشد'))}login('resident')})();
</script></body></html>
