<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<title>سامانه مجتمع اندیشه</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#111827;--muted:#7b8495;--line:#e5e9f1;--brand:#3157d5;--brand2:#6a5ee8;--ok:#16866b;--bad:#c83d52;--shadow:0 18px 55px rgba(24,34,63,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
/* Login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 20% 5%,#dfe7ff 0,#f6f8fc 38%,#e9edf7 100%)}
.login-card{width:min(410px,100%);background:rgba(255,255,255,.96);border:1px solid #e3e8f1;border-radius:30px;padding:30px;box-shadow:0 30px 90px rgba(23,34,66,.16)}
.login-icon{width:68px;height:68px;margin:0 auto 17px;border-radius:22px;display:grid;place-items:center;background:linear-gradient(145deg,#0d1425,#3958b1);color:#fff;font-size:29px;box-shadow:0 15px 35px rgba(49,87,213,.25)}
.login-card h1{text-align:center;margin:0;font-size:24px}.login-card .sub{text-align:center;color:var(--muted);font-size:10px;margin:8px 0 24px}.field{margin:12px 0}.field label{display:block;color:#626d80;font-size:10px;margin-bottom:6px}.input,.select{width:100%;height:44px;border:1px solid #dce2eb;background:#fff;border-radius:13px;padding:0 12px;outline:0;color:var(--ink)}.input:focus,.select:focus{border-color:#6d7fe0;box-shadow:0 0 0 4px rgba(49,87,213,.08)}.primary{border:0;width:100%;height:45px;border-radius:13px;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));font-size:11px;font-weight:700;box-shadow:0 10px 25px rgba(49,87,213,.22)}.admin-login-link{display:block;text-align:center;margin-top:15px;color:#8992a3;text-decoration:none;font-size:9px}.admin-login-link:hover{color:var(--brand)}.login-note{text-align:center;color:#9aa2b1;font-size:8px;margin-top:13px;line-height:1.8}
/* App */
.wrap{max-width:1240px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:3px 0 14px}.brand{display:flex;align-items:center;gap:10px}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#101827,#3d59b1);box-shadow:0 9px 25px rgba(24,36,73,.16)}.brand b{display:block;font-size:15px}.brand small{display:block;color:#8992a2;font-size:9px;margin-top:3px}.top-link{border:0;background:transparent;color:#8a93a4;font-size:9px}.hero{background:radial-gradient(circle at 10% 10%,#536fe0 0,#293d70 38%,#0d1628 100%);color:#fff;border-radius:25px;padding:25px;box-shadow:0 20px 55px rgba(25,43,79,.16)}.hero small{color:#d2dbf2;font-size:9px}.hero h1{margin:7px 0;font-size:24px}.hero p{margin:0;color:#dce4f2;font-size:10px;line-height:2}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 13px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:9px;font-weight:700}.btn.light{background:#edf1f7;color:#3d485b}.btn.green{background:#e7f7f1;color:#11785f}.btn.red{background:#fff0f2;color:#bb3046}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:var(--shadow)}.stat small{font-size:9px;color:var(--muted)}.stat b{display:block;font-size:19px;margin-top:7px}.good{color:var(--ok)!important}.bad{color:var(--bad)!important}.nav{display:flex;gap:7px;overflow:auto;margin:12px 0}.nav button{border:1px solid var(--line);background:#fff;color:#596477;border-radius:12px;padding:9px 13px;font-size:9px;white-space:nowrap}.nav button.on{background:#eaf0ff;color:#294eaf;border-color:#ccd8ff;font-weight:700}.searchbar{position:relative}.searchbar .input{padding-right:40px}.search-icon{position:absolute;right:13px;top:13px;color:#9aa3b2;font-size:13px}.tablebox{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:10px}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:9px 8px;border-bottom:1px solid #edf0f4;text-align:right;font-size:9px;vertical-align:middle}.table th{background:#fafbfd;color:#697386}.table tr:last-child td{border-bottom:0}.inline-input{width:100%;min-width:85px;height:34px;border:1px solid #dde3ec;border-radius:9px;padding:0 7px;background:#fff;outline:0;font-size:9px}.inline-input:focus{border-color:#6d7fe0;box-shadow:0 0 0 3px rgba(49,87,213,.08)}.money-input{min-width:120px}.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:8px;background:#eef1f5;color:#677184}.pill.good{background:#e6f7f0}.pill.bad{background:#ffebef}.unit-result{margin-top:12px}.unit-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.unit-title{font-size:15px;margin:0}.hint{font-size:9px;color:#7c8697;line-height:1.9}.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.month-table{min-width:650px}.month-table input{min-width:120px}.empty{text-align:center;color:#8d96a5;padding:25px;font-size:10px}.modal{position:fixed;inset:0;background:rgba(8,14,28,.58);display:none;place-items:center;padding:14px;z-index:50}.modal.show{display:grid}.modalbox{width:min(1100px,100%);max-height:94vh;overflow:auto;background:#fff;border-radius:23px;padding:18px}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{font-size:14px;margin:0}.print-title{display:none}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{padding:11px}.stats{grid-template-columns:1fr 1fr}.detail-grid{grid-template-columns:1fr}.hero{border-radius:21px}.login-card{padding:24px}.table{min-width:780px}}
@media print{body{background:#fff}.noprint,.nav,.top-link,.actions,.searchbar,.no-print{display:none!important}.wrap{max-width:none;padding:0}.card,.hero{box-shadow:none;border:1px solid #ddd}.tablebox{overflow:visible}.table{min-width:0}.print-title{display:block!important}.print-title h2{font-size:18px;margin:0 0 12px}.no-print-col{display:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script src="data.js"></script>
<script>
/* فقط ماه‌های مورد نیاز مجتمع */
const months=['تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const KEY='andisheh_v5';
let db=JSON.parse(localStorage.getItem(KEY)||localStorage.getItem('andisheh_v4')||'null')||structuredClone(APP_DATA);
db.months=months.slice();
db.units.forEach(u=>{u.charges=u.charges||{};u.payments=Array.isArray(u.payments)?u.payments:[];u.opening=+u.opening||0;});
const money=n=>new Intl.NumberFormat('fa-IR').format(+n||0)+' تومان';
const unit=id=>db.units.find(u=>String(u.id)===String(id));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));
const chargeTotal=u=>months.reduce((s,m)=>s+(+u.charges?.[m]||0),0);
const paid=u=>u.payments.reduce((s,p)=>s+(+p.amount||0),0);
const monthPaid=(u,m)=>u.payments.filter(p=>p.month===m).reduce((s,p)=>s+(+p.amount||0),0);
const monthState=(u,m)=>{let c=+u.charges?.[m]||0,p=monthPaid(u,m);if(!c&&!p)return {label:'خالی',cls:'pill'};if(c>0&&p>=c)return {label:'تسویه',cls:'pill good'};if(p>0)return {label:'جزئی',cls:'pill'};return {label:'پرداخت نشده',cls:'pill bad'}};
const balance=u=>(+u.opening||0)+chargeTotal(u)-paid(u);
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;').replaceAll('>','&gt;')}
function toast(t){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style='position:fixed;bottom:16px;right:16px;background:#111827;color:#fff;padding:10px 14px;border-radius:12px;font-size:10px;z-index:100;box-shadow:0 10px 30px #0003';document.body.appendChild(x)}x.textContent=t;clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.remove(),2200)}
function login(kind='resident'){
 document.getElementById('app').innerHTML=`<div class="login"><div class="login-card">
 <div class="login-icon">⌂</div><h1>مجتمع اندیشه</h1><div class="sub">${kind==='admin'?'ورود مدیر مجتمع':'ورود ساکن'}</div>
 <div class="field"><label>${kind==='admin'?'نام کاربری':'شماره واحد'}</label><input id="lid" class="input" type="text" inputmode="${kind==='admin'?'text':'numeric'}" autocomplete="off" placeholder="${kind==='admin'?'نام کاربری مدیر':'مثلاً ۱۰'}"></div>
 <div class="field"><label>رمز عبور</label><input id="lp" class="input" type="password" inputmode="text" autocomplete="new-password" placeholder="رمز عبور" onkeydown="if(event.key==='Enter')doLogin('${kind}')"></div>
 <button class="primary" onclick="doLogin('${kind}')">ورود</button>
 ${kind==='resident'?'<a class="admin-login-link" href="#" onclick="event.preventDefault();login(\'admin\')">ورود مدیر</a>':'<a class="admin-login-link" href="#" onclick="event.preventDefault();login(\'resident\')">بازگشت به ورود ساکن</a>'}
 <div class="login-note">ورود مدیر با نام کاربری و رمز شامل حروف انگلیسی نیز امکان‌پذیر است.</div>
 </div></div>`;
 setTimeout(()=>document.getElementById('lid')?.focus(),50);
}
function doLogin(kind){let id=document.getElementById('lid').value.trim(),pw=document.getElementById('lp').value;if(kind==='admin'){if(id==='admin'&&pw==='eskandari1234')admin();else toast('نام کاربری یا رمز مدیر نادرست است')}else{let u=unit(id);if(u&&String(u.password)===pw)resident(u);else toast('شماره واحد یا رمز نادرست است')}}
function header(title,sub){return `<div class="top"><div class="brand"><div class="logo">⌂</div><div><b>${title}</b><small>${sub}</small></div></div><button class="top-link noprint" onclick="login('resident')">خروج</button></div>`}
function printCurrent(){window.print()}
function resident(u){
 document.getElementById('app').innerHTML=`<main class="wrap">${header('مجتمع اندیشه','حساب ساکن • واحد '+u.id)}
 <section class="hero"><small>حساب شخصی</small><h1>${esc(u.name||'ساکن واحد '+u.id)}</h1><p>${esc(u.phone||'شماره تلفن ثبت نشده')}</p></section>
 <div class="stats"><div class="card stat"><small>بدهی پیشین</small><b class="${u.opening>0?'bad':''}">${money(u.opening)}</b></div><div class="card stat"><small>جمع شارژ</small><b>${money(chargeTotal(u))}</b></div><div class="card stat"><small>جمع پرداخت</small><b class="good">${money(paid(u))}</b></div><div class="card stat"><small>مانده</small><b class="${balance(u)>0?'bad':'good'}">${money(Math.max(balance(u),0))}</b></div></div>
 <div class="card"><div class="toolbar"><div><h3 style="font-size:13px;margin:0">وضعیت شارژ</h3><div class="hint">وضعیت هر ماه از تیر تا اسفند.</div></div><button class="btn light noprint" onclick="printCurrent()">چاپ</button></div>
 <div class="tablebox"><table class="table month-table"><tr><th>ماه</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${months.map(m=>{let c=+u.charges?.[m]||0,p=monthPaid(u,m),s=monthState(u,m);return `<tr><td><b>${m}</b></td><td>${money(c)}</td><td>${money(p)}</td><td>${money(Math.max(c-p,0))}</td><td><span class="${s.cls}">${s.label}</span></td></tr>`}).join('')}</table></div></div>
 <div class="card" style="margin-top:10px"><div class="toolbar"><h3 style="font-size:13px;margin:0">مشخصات</h3></div><div class="detail-grid"><div><span class="hint">شماره واحد</span><br><b>${u.id}</b></div><div><span class="hint">نام</span><br><b>${esc(u.name||'—')}</b></div><div><span class="hint">شماره تلفن</span><br><b>${esc(u.phone||'—')}</b></div><div><span class="hint">بدهی پیشین</span><br><b>${money(u.opening)}</b></div></div></div>
 </main>`;
}
function admin(){document.getElementById('app').innerHTML=`<main class="wrap">${header('مدیریت مجتمع اندیشه','پنل مدیر • اطلاعات ۲۱۰ واحد')}<div class="nav noprint" id="nav"><button onclick="tab('overview')">نمای کلی</button><button onclick="tab('units')">واحدها</button><button onclick="tab('search')">جستجو</button><button onclick="tab('passwords')">رمزها</button></div><div id="content"></div></main>`;tab('overview')}
function tab(t){document.querySelectorAll('#nav button').forEach((b,i)=>b.classList.toggle('on',['overview','units','search','passwords'][i]===t));document.getElementById('content').innerHTML={overview:overviewPage,units:unitsPage,search:searchPage,passwords:passwordPage}[t]();if(t==='units')renderUnitTable();if(t==='search')focusSearch()}
function overviewPage(){let debt=db.units.filter(u=>balance(u)>0);return `<div class="print-title"><h2>مجتمع اندیشه — نمای کلی</h2></div><section class="hero"><small>پنل مدیریت</small><h1>همه واحدها، ساده و قابل ویرایش</h1><p>نام، شماره تلفن، شماره واحد و بدهی پیشین را مستقیم از جدول تغییر بدهید. برای جزئیات هر واحد روی «جزئیات» بزنید.</p></section><div class="stats"><div class="card stat"><small>تعداد واحد</small><b>${db.units.length}</b></div><div class="card stat"><small>بدهکار</small><b class="bad">${debt.length}</b></div><div class="card stat"><small>کل پرداخت</small><b class="good">${money(db.units.reduce((s,u)=>s+paid(u),0))}</b></div><div class="card stat"><small>جمع بدهی فعلی</small><b class="bad">${money(debt.reduce((s,u)=>s+Math.max(balance(u),0),0))}</b></div></div><div class="card"><div class="toolbar"><div><h3 style="font-size:13px;margin:0">فهرست ۲۱۰ واحد</h3><div class="hint">برای ویرایش مستقیم، به بخش «واحدها» برو.</div></div><div class="actions noprint"><button class="btn light" onclick="tab('units')">مدیریت جدول</button><button class="btn light" onclick="printCurrent()">چاپ</button></div></div><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>بدهی پیشین</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${db.units.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name||'—')}</td><td>${esc(u.phone||'—')}</td><td>${money(u.opening)}</td><td>${money(paid(u))}</td><td>${money(Math.max(balance(u),0))}</td><td><span class="pill ${balance(u)>0?'bad':'good'}">${balance(u)>0?'بدهکار':'تسویه'}</span></td></tr>`).join('')}</table></div></div>`}
function unitsPage(){return `<div class="card"><div class="toolbar"><div><h3 style="font-size:13px;margin:0">مدیریت همه واحدها</h3><div class="hint">شماره واحد، نام، تلفن و بدهی پیشین را همین‌جا تغییر بده و «ذخیره» را بزن.</div></div><div class="actions noprint"><button class="btn light" onclick="printCurrent()">چاپ جدول</button></div></div><div class="searchbar noprint"><span class="search-icon">⌕</span><input id="unitSearch" class="input" placeholder="جستجو با شماره واحد، نام یا شماره تلفن" oninput="renderUnitTable()"></div><div class="tablebox"><table class="table"><thead><tr><th>شماره واحد</th><th>نام</th><th>شماره تلفن</th><th>بدهی پیشین</th><th>پرداخت ثبت‌شده</th><th>مانده</th><th class="no-print-col"></th></tr></thead><tbody id="unitRows"></tbody></table></div></div>`}
function renderUnitTable(){let q=(document.getElementById('unitSearch')?.value||'').trim().toLowerCase();let arr=db.units.filter(u=>String(u.id).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q));document.getElementById('unitRows').innerHTML=arr.map(u=>`<tr data-old="${u.id}"><td><input id="id_${u.id}" class="inline-input" value="${esc(u.id)}" inputmode="numeric"></td><td><input id="name_${u.id}" class="inline-input" value="${esc(u.name||'')}"></td><td><input id="phone_${u.id}" class="inline-input" value="${esc(u.phone||'')}" inputmode="tel"></td><td><input id="open_${u.id}" class="inline-input money-input" type="number" value="${+u.opening||0}"></td><td>${money(paid(u))}</td><td>${money(Math.max(balance(u),0))}</td><td class="no-print-col"><div class="actions"><button class="btn" onclick="saveInlineUnit(${u.id})">ذخیره</button><button class="btn light" onclick="openUnit(${u.id})">جزئیات</button></div></td></tr>`).join('')||'<tr><td colspan="7" class="empty">موردی پیدا نشد.</td></tr>'}
async function saveInlineUnit(oldId){let u=unit(oldId);if(!u)return;let newId=String(document.getElementById('id_'+oldId).value).trim();if(!/^\d+$/.test(newId)||+newId<1||+newId>999)return toast('شماره واحد باید عددی باشد');let num=+newId;if(num!==+oldId&&unit(num))return toast('این شماره واحد قبلاً استفاده شده است');let old=+u.id;u.id=num;u.name=document.getElementById('name_'+oldId).value;u.phone=document.getElementById('phone_'+oldId).value;u.opening=+document.getElementById('open_'+oldId).value||0;db.units.sort((a,b)=>+a.id-+b.id);save();toast('اطلاعات واحد ذخیره شد');try{if(typeof cloudUnit==='function'){await cloudUnit(u);if(old!==num&&typeof cloudUnit==='function')await SB('units?id=eq.'+old,{method:'DELETE'});await cloudCharges();await cloudPayments()} }catch(e){console.error(e);toast('ذخیره ابری ناموفق بود')}renderUnitTable()}
function searchPage(){return `<div class="card"><div class="toolbar"><div><h3 style="font-size:13px;margin:0">جستجوی سریع ساکن</h3><div class="hint">شماره تلفن، نام یا شماره واحد را وارد کن؛ اطلاعات همان واحد نمایش داده می‌شود.</div></div><button class="btn light noprint" onclick="printCurrent()">چاپ نتیجه</button></div><div class="searchbar noprint" style="margin-top:12px"><span class="search-icon">⌕</span><input id="globalSearch" class="input" inputmode="tel" placeholder="مثلاً 0912... یا نام یا شماره واحد" oninput="renderSearch()"></div><div id="searchResult" class="unit-result"></div></div>`}
function focusSearch(){setTimeout(()=>document.getElementById('globalSearch')?.focus(),50)}
function renderSearch(){let q=(document.getElementById('globalSearch')?.value||'').trim().toLowerCase();let box=document.getElementById('searchResult');if(!q){box.innerHTML='<div class="empty">شماره تلفن یا نام یا شماره واحد را وارد کنید.</div>';return}let found=db.units.filter(u=>String(u.id).includes(q)||(u.name||'').toLowerCase().includes(q)||(u.phone||'').includes(q));if(!found.length){box.innerHTML='<div class="empty">موردی پیدا نشد.</div>';return}box.innerHTML=found.map(u=>searchCard(u)).join('')}
function searchCard(u){return `<div class="card" style="margin-top:10px"><div class="unit-head"><div><h3 class="unit-title">واحد ${u.id} — ${esc(u.name||'بدون نام')}</h3><div class="hint">تلفن: ${esc(u.phone||'ثبت نشده')} • بدهی پیشین: ${money(u.opening)}</div></div><div class="actions noprint"><button class="btn" onclick="openUnit(${u.id})">ویرایش کامل</button><button class="btn light" onclick="printUnit(${u.id})">چاپ</button></div></div><div class="tablebox"><table class="table month-table"><tr><th>ماه</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${months.map(m=>monthEditorRow(u,m)).join('')}</table></div></div>`}
function monthEditorRow(u,m){let c=+u.charges?.[m]||0,p=monthPaid(u,m),s=monthState(u,m);return `<tr><td><b>${m}</b></td><td><input class="inline-input money-input" type="number" value="${c}" onchange="setCharge(${u.id},'${m}',this.value)"></td><td><input class="inline-input money-input" type="number" value="${p}" onchange="setMonthPayment(${u.id},'${m}',this.value)"></td><td>${money(Math.max(c-p,0))}</td><td><span class="${s.cls}">${s.label}</span></td></tr>`}
async function setCharge(id,m,v){let u=unit(id);u.charges[m]=+v||0;save();try{if(typeof cloudCharges==='function')await cloudCharges()}catch(e){toast('ذخیره ابری شارژ ناموفق بود')}renderSearch()}
async function setMonthPayment(id,m,v){let u=unit(id),amount=+v||0;u.payments=u.payments.filter(p=>p.month!==m);if(amount>0)u.payments.push({month:m,amount,date:'',method:'',ref:''});save();try{if(typeof cloudPayments==='function')await cloudPayments()}catch(e){toast('ذخیره ابری پرداخت ناموفق بود')}renderSearch()}
function openUnit(id){let u=unit(id);if(!u)return;showModal(`<div class="modal-head"><h2>ویرایش واحد ${u.id}</h2><button class="btn light" onclick="closeModal()">بستن</button></div><div class="detail-grid"><div class="field"><label>شماره واحد</label><input id="m_id" class="input" value="${esc(u.id)}" inputmode="numeric"></div><div class="field"><label>نام</label><input id="m_name" class="input" value="${esc(u.name||'')}"></div><div class="field"><label>شماره تلفن</label><input id="m_phone" class="input" value="${esc(u.phone||'')}" inputmode="tel"></div><div class="field"><label>بدهی پیشین</label><input id="m_open" class="input" type="number" value="${+u.opening||0}"></div><div class="field"><label>رمز ساکن</label><input id="m_pass" class="input" type="text" inputmode="text" value="${esc(u.password||'')}"></div></div><h3 style="font-size:12px;margin:18px 0 8px">شارژ و پرداخت ماه‌به‌ماه</h3><div class="tablebox"><table class="table month-table"><tr><th>ماه</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${months.map(m=>monthEditorRow(u,m)).join('')}</table></div><div class="actions" style="margin-top:14px"><button class="btn" onclick="saveModalUnit(${id})">ذخیره تغییرات</button><button class="btn light" onclick="printUnit(${id})">چاپ واحد</button></div>`)}
async function saveModalUnit(oldId){let u=unit(oldId);let newId=String(document.getElementById('m_id').value).trim();if(!/^\d+$/.test(newId)||+newId<1||+newId>999)return toast('شماره واحد باید عددی باشد');let num=+newId;if(num!==+oldId&&unit(num))return toast('این شماره واحد قبلاً استفاده شده است');let old=+u.id;u.id=num;u.name=document.getElementById('m_name').value;u.phone=document.getElementById('m_phone').value;u.opening=+document.getElementById('m_open').value||0;u.password=document.getElementById('m_pass').value;db.units.sort((a,b)=>+a.id-+b.id);save();try{if(typeof cloudUnit==='function'){await cloudUnit(u);if(old!==num)await SB('units?id=eq.'+old,{method:'DELETE'});await cloudCharges();await cloudPayments()}}catch(e){console.error(e);toast('ذخیره ابری ناموفق بود')}closeModal();tab('units');toast('تغییرات ذخیره شد')}
function printUnit(id){let u=unit(id);if(!u)return;let w=window.open('','_blank');if(!w)return toast('مرورگر اجازه چاپ نداد');let rows=months.map(m=>{let c=+u.charges?.[m]||0,p=monthPaid(u,m),s=monthState(u,m);return `<tr><td>${m}</td><td>${money(c)}</td><td>${money(p)}</td><td>${money(Math.max(c-p,0))}</td><td>${s.label}</td></tr>`}).join('');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>واحد ${u.id}</title><style>body{font-family:Tahoma,Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:right;font-size:11px}h1{font-size:20px}</style></head><body><h1>مجتمع اندیشه — واحد ${u.id}</h1><p>نام: ${esc(u.name||'—')}<br>تلفن: ${esc(u.phone||'—')}<br>بدهی پیشین: ${money(u.opening)}</p><table><tr><th>ماه</th><th>شارژ</th><th>پرداخت</th><th>مانده</th><th>وضعیت</th></tr>${rows}</table><script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()}
function passwordPage(){return `<div class="card"><div class="toolbar"><div><h3 style="font-size:13px;margin:0">رمز ورود ساکنین</h3><div class="hint">رمزها را ببین، تغییر بده و چاپ کن.</div></div><div class="actions noprint"><button class="btn light" onclick="printPasswords()">چاپ رمزها</button></div></div><div class="tablebox"><table class="table"><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th><th class="no-print-col"></th></tr>${db.units.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name||'—')}</td><td>${esc(u.phone||'—')}</td><td><input class="inline-input" style="max-width:180px" type="text" value="${esc(u.password||'')}" onchange="setPassword(${u.id},this.value)"></td><td class="no-print-col"><button class="btn light" onclick="openUnit(${u.id})">ویرایش</button></td></tr>`).join('')}</table></div></div>`}
async function setPassword(id,v){let u=unit(id);u.password=v;save();try{if(typeof cloudUnit==='function')await cloudUnit(u);toast('رمز ذخیره شد')}catch(e){toast('ذخیره ابری رمز ناموفق بود')}}
function printPasswords(){let rows=db.units.map(u=>`<tr><td>${u.id}</td><td>${esc(u.name||'—')}</td><td>${esc(u.phone||'—')}</td><td><b>${esc(u.password||'')}</b></td></tr>`).join('');let w=window.open('','_blank');if(!w)return toast('مرورگر اجازه چاپ نداد');w.document.write(`<html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>رمزهای مجتمع اندیشه</title><style>body{font-family:Tahoma,Arial;padding:25px}table{width:100%;border-collapse:collapse}th,td{border:1px solid #ddd;padding:8px;text-align:right;font-size:11px}h1{font-size:20px}</style></head><body><h1>مجتمع اندیشه — رمز ورود ساکنین</h1><table><tr><th>واحد</th><th>نام</th><th>تلفن</th><th>رمز</th></tr>${rows}</table><script>window.onload=function(){window.print()}<\/script></body></html>`);w.document.close()}
function showModal(h){document.getElementById('modalbox').innerHTML=h;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
</script>
<script src="supabase-config.js"></script>
<script>
async function SB(path,opt={}){const h=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},opt.headers||{});const r=await fetch(SUPABASE_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:h}));if(!r.ok)throw Error(await r.text());const ct=r.headers.get('content-type')||'';return ct.includes('json')?r.json():null}
async function cloudLoad(){try{const us=await SB('units?select=*&order=id.asc');for(const r of us||[]){const u=unit(r.id);if(!u)continue;Object.assign(u,{name:r.name||'',phone:r.phone||'',password:r.password??u.password,owner:r.owner||'',tenant:r.tenant||'',area:r.area||'',floor:r.floor||'',parking:r.parking||'',storage:r.storage||'',opening:+(r.opening||0),notes:r.notes||'',carIran:r.car_iran||'',carMid:r.car_mid||'',carLetter:r.car_letter||'',carEnd:r.car_end||'',carName:r.car_name||'',carColor:r.car_color||''})}const cs=await SB('charges?select=unit_id,month,amount');for(const r of cs||[]){const u=unit(r.unit_id);if(u&&months.includes(r.month))u.charges[r.month]=+(r.amount||0)}const ps=await SB('payments?select=unit_id,month,amount,payment_date,method,reference&order=id.asc');db.units.forEach(u=>u.payments=[]);for(const r of ps||[]){const u=unit(r.unit_id);if(u&&months.includes(r.month))u.payments.push({month:r.month||'',amount:+(r.amount||0),date:r.payment_date||'',method:r.method||'',ref:r.reference||''})}save();return true}catch(e){console.error('cloudLoad',e);return false}}
async function cloudUnit(u){return SB('units?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:u.id,name:u.name||'',phone:u.phone||'',password:u.password||'',owner:u.owner||'',tenant:u.tenant||'',area:u.area||'',floor:u.floor||'',parking:u.parking||'',storage:u.storage||'',opening:+(u.opening||0),notes:u.notes||'',car_iran:u.carIran||'',car_mid:u.carMid||'',car_letter:u.carLetter||'',car_end:u.carEnd||'',car_name:u.carName||'',car_color:u.carColor||''})})}
async function cloudCharges(){const old=await SB('charges?select=id');for(const r of old||[])await SB('charges?id=eq.'+r.id,{method:'DELETE'});const rows=[];for(const u of db.units)for(const m of months){const a=+(u.charges[m]||0);if(a)rows.push({unit_id:u.id,month:m,amount:a})}if(rows.length)await SB('charges',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)})}
async function cloudPayments(){const old=await SB('payments?select=id');for(const r of old||[])await SB('payments?id=eq.'+r.id,{method:'DELETE'});const rows=[];for(const u of db.units)for(const p of u.payments)rows.push({unit_id:u.id,month:p.month||'',amount:+(p.amount||0),payment_date:p.date||'',method:p.method||'',reference:p.ref||''});if(rows.length)await SB('payments',{method:'POST',headers:{'Prefer':'return=minimal'},body:JSON.stringify(rows)})}
(async()=>{const ok=await cloudLoad();if(!ok)toast('Supabase در دسترس نیست؛ اطلاعات محلی نمایش داده می‌شود');login('resident')})()
</script>
